<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Walkie-Chatie — Sign Up</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Serif:ital,opsz,wght@0,8..144,100..900;1,8..144,100..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --black:#000;--dark:#0a0a0a;--dark2:#111;--dark3:#1a1a1a;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.13);
  --text:#fff;--text2:#999;--text3:#555;
  --r:5px;
}
html,body{height:100%;background:var(--black);font-family:'Share Tech Mono',monospace;color:var(--text);overflow-x:hidden}
.scanlines{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.04) 2px,rgba(0,0,0,0.04) 4px)}
.page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;position:relative;z-index:1}
.logo{font-family:'EB Garamond',serif;font-size:clamp(28px,6vw,42px);font-weight:400;letter-spacing:1px;color:#fff;margin-bottom:6px;text-align:center}
.logo-sub{font-size:9px;letter-spacing:3px;color:var(--text3);text-transform:uppercase;margin-bottom:36px;text-align:center}
.card{width:100%;max-width:400px;background:var(--dark2);border:1px solid var(--border2);border-radius:var(--r);padding:28px 28px 24px;position:relative}
.card-title{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--text2);margin-bottom:24px;text-align:center}
.field{margin-bottom:16px}
.field label{display:block;font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text3);margin-bottom:7px}
.field input{width:100%;height:48px;background:var(--dark3);border:1px solid var(--border2);border-radius:var(--r);
  font-family:'Share Tech Mono',monospace;font-size:14px;color:var(--text);padding:0 16px;outline:none;transition:border-color .2s}
.field input::placeholder{color:var(--text3)}
.field input:focus{border-color:rgba(255,255,255,0.4)}
.field input.err{border-color:#ff453a}
.pfp-row{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.pfp-preview{width:52px;height:52px;border-radius:var(--r);background:var(--dark3);border:1px solid var(--border2);
  object-fit:cover;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden}
.pfp-preview .material-icons-round{font-size:24px;color:var(--text3)}
.pfp-preview img{width:100%;height:100%;object-fit:cover;display:none}
.pfp-upload-btn{flex:1;height:40px;background:var(--dark3);border:1px solid var(--border2);border-radius:var(--r);
  font-family:'Share Tech Mono',monospace;font-size:10px;letter-spacing:1px;color:var(--text2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;transition:border-color .2s;text-transform:uppercase}
.pfp-upload-btn:hover{border-color:rgba(255,255,255,0.3);color:var(--text)}
.pfp-upload-btn .material-icons-round{font-size:16px}
#pfp-file{display:none}
.pfp-progress{font-size:9px;color:var(--text3);margin-top:5px;letter-spacing:1px;min-height:14px}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--text3);font-size:9px;letter-spacing:1px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.google-btn{width:100%;height:48px;background:transparent;border:1px solid var(--border2);border-radius:var(--r);
  font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:1px;color:var(--text2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;transition:border-color .2s,color .2s;text-transform:uppercase;margin-bottom:16px}
.google-btn:hover{border-color:rgba(255,255,255,0.3);color:var(--text)}
.google-btn svg{flex-shrink:0}
.primary-btn{width:100%;height:50px;background:#fff;color:#000;border:none;border-radius:var(--r);
  font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;
  transition:opacity .2s,transform .15s;margin-top:4px;display:flex;align-items:center;justify-content:center;gap:8px}
.primary-btn:hover{opacity:.88;transform:translateY(-1px)}
.primary-btn:active{transform:scale(.97)}
.primary-btn:disabled{opacity:.4;pointer-events:none}
.primary-btn .material-icons-round{font-size:18px}
.foot{margin-top:18px;text-align:center;font-size:10px;color:var(--text3);letter-spacing:.5px}
.foot a{color:var(--text2);text-decoration:none;border-bottom:1px solid var(--border2)}
.foot a:hover{color:var(--text)}
.err-msg{font-size:9px;color:#ff453a;letter-spacing:.5px;margin-top:5px;min-height:14px;display:none}
.err-msg.show{display:block}
</style>
</head>
<body>
<div class="scanlines"></div>
<div class="page">
  <div class="logo">Walkie-Chatie</div>
  <div class="logo-sub">Open Frequency Network</div>

  <div class="card">
    <div class="card-title">Create Account</div>

    <!-- Google sign-up -->
    <button class="google-btn" onclick="googleAuth()">
      <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.79-.07-1.54-.19-2.27h-11.3v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58v3h3.86c2.26-2.09 3.56-5.17 3.56-8.82z"/><path fill="#34A853" d="M12.255 24c3.24 0 5.95-1.08 7.93-2.91l-3.86-3c-1.08.72-2.45 1.16-4.07 1.16-3.13 0-5.78-2.11-6.73-4.96h-3.98v3.09C3.515 21.3 7.565 24 12.255 24z"/><path fill="#FBBC05" d="M5.525 14.29c-.25-.72-.38-1.49-.38-2.29s.14-1.57.38-2.29V6.62h-3.98a11.86 11.86 0 0 0 0 10.76l3.98-3.09z"/><path fill="#EA4335" d="M12.255 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C18.205 1.19 15.495 0 12.255 0c-4.69 0-8.74 2.7-10.71 6.62l3.98 3.09c.95-2.85 3.6-4.96 6.73-4.96z"/></svg>
      Continue with Google
    </button>

    <div class="divider">or</div>

    <!-- Profile picture -->
    <div class="pfp-row">
      <div class="pfp-preview" id="pfp-preview">
        <span class="material-icons-round">person</span>
        <img id="pfp-img" alt="pfp">
      </div>
      <div style="flex:1">
        <div class="pfp-upload-btn" onclick="document.getElementById('pfp-file').click()">
          <span class="material-icons-round">upload</span>
          Upload Photo
        </div>
        <div class="pfp-progress" id="pfp-progress"></div>
      </div>
      <input type="file" id="pfp-file" accept="image/*" onchange="handlePfpSelect(event)">
    </div>

    <div class="field">
      <label>Username / Callsign</label>
      <input type="text" id="su-username" placeholder="@callsign" maxlength="20" autocomplete="off" spellcheck="false">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="su-email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="su-pass" placeholder="Min 6 characters" autocomplete="new-password">
    </div>
    <div class="err-msg" id="su-err"></div>

    <button class="primary-btn" id="su-btn" onclick="signUp()">
      <span class="material-icons-round">cell_tower</span>
      Create Account
    </button>

    <div class="foot">
      Already have an account? <a href="signin.html">Sign in</a><br><br>
      <a href="index.html" style="color:var(--text3);border-color:transparent">Enter as Anonymous instead</a>
    </div>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
const FB = {
  apiKey:"AIzaSyDW0UpHNzP_JaOsDH_6ZFlA3wHg26M8Y4s",
  authDomain:"locationchatbase.firebaseapp.com",
  databaseURL:"https://locationchatbase-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"locationchatbase",
  storageBucket:"locationchatbase.firebasestorage.app",
  messagingSenderId:"645678725889",
  appId:"1:645678725889:web:2a36a0aebc1d1dcb6af900"
};
firebase.initializeApp(FB);
const auth = firebase.auth();
const db = firebase.database();

const S3 = { region:'ap-southeast-2', bucket:'boalhathakey', keyId:'AKIAYXUC44KXTUULTTWI', secret:'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' };

let pfpFile = null, pfpUrl = null;

function showErr(msg){ const e=document.getElementById('su-err'); e.textContent=msg; e.classList.add('show'); }
function clearErr(){ const e=document.getElementById('su-err'); e.textContent=''; e.classList.remove('show'); }

function handlePfpSelect(evt){
  const file = evt.target.files[0];
  if(!file) return;
  if(file.size > 5*1024*1024){ showErr('Image must be under 5 MB'); return; }
  pfpFile = file;
  const reader = new FileReader();
  reader.onload = e => {
    const img = document.getElementById('pfp-img');
    img.src = e.target.result;
    img.style.display = 'block';
    document.querySelector('#pfp-preview .material-icons-round').style.display='none';
  };
  reader.readAsDataURL(file);
  document.getElementById('pfp-progress').textContent = 'Ready to upload';
}

async function uploadPfpToS3(uid){
  if(!pfpFile) return null;
  const prog = document.getElementById('pfp-progress');
  prog.textContent = 'Uploading...';
  try {
    const ext = pfpFile.name.split('.').pop();
    const key = `pfp/${uid}.${ext}`;
    const url = `https://${S3.bucket}.s3.${S3.region}.amazonaws.com/${key}`;
    // Build AWS Signature v4 (simple PUT)
    const now = new Date();
    const dateStr = now.toISOString().replace(/[:\-]|\.\d{3}/g,'').substring(0,15)+'Z';
    const dateOnly = dateStr.substring(0,8);
    const credScope = `${dateOnly}/${S3.region}/s3/aws4_request`;
    const canonHeaders = `content-type:${pfpFile.type}\nhost:${S3.bucket}.s3.${S3.region}.amazonaws.com\nx-amz-date:${dateStr}\n`;
    const signedHeaders = 'content-type;host;x-amz-date';
    const payloadHash = 'UNSIGNED-PAYLOAD';
    const canonReq = `PUT\n/${key}\n\n${canonHeaders}\n${signedHeaders}\n${payloadHash}`;
    const strToSign = `AWS4-HMAC-SHA256\n${dateStr}\n${credScope}\n${await sha256hex(canonReq)}`;
    const sigKey = await getSigningKey(S3.secret, dateOnly, S3.region, 's3');
    const sig = await hmacHex(sigKey, strToSign);
    const auth = `AWS4-HMAC-SHA256 Credential=${S3.keyId}/${credScope},SignedHeaders=${signedHeaders},Signature=${sig}`;
    const res = await fetch(url, {
      method:'PUT',
      headers:{'Content-Type':pfpFile.type,'x-amz-date':dateStr,'Authorization':auth,'x-amz-content-sha256':'UNSIGNED-PAYLOAD'},
      body: pfpFile
    });
    if(res.ok){ prog.textContent = '✓ Uploaded'; return url+'?v='+Date.now(); }
    else { prog.textContent = 'Upload failed — using default'; return null; }
  } catch(e){ prog.textContent = 'Upload error'; return null; }
}

async function sha256hex(msg){
  const enc = new TextEncoder();
  const buf = await crypto.subtle.digest('SHA-256', enc.encode(msg));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function hmacRaw(key, msg){
  const k = typeof key === 'string' ? new TextEncoder().encode(key) : key;
  const m = typeof msg === 'string' ? new TextEncoder().encode(msg) : msg;
  const ck = await crypto.subtle.importKey('raw',k,{name:'HMAC',hash:'SHA-256'},false,['sign']);
  return new Uint8Array(await crypto.subtle.sign('HMAC',ck,m));
}
async function hmacHex(key,msg){ return Array.from(await hmacRaw(key,msg)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
async function getSigningKey(secret,date,region,service){
  let k = await hmacRaw('AWS4'+secret,date);
  k = await hmacRaw(k, region);
  k = await hmacRaw(k, service);
  k = await hmacRaw(k, 'aws4_request');
  return k;
}

async function signUp(){
  clearErr();
  const username = document.getElementById('su-username').value.trim();
  const email = document.getElementById('su-email').value.trim();
  const pass = document.getElementById('su-pass').value;
  if(!username){ showErr('Callsign required'); return; }
  if(!email){ showErr('Email required'); return; }
  if(pass.length < 6){ showErr('Password must be at least 6 characters'); return; }
  const btn = document.getElementById('su-btn');
  btn.disabled = true; btn.innerHTML = '<span class="material-icons-round" style="animation:spin .8s linear infinite">refresh</span> Creating...';
  try {
    const cred = await auth.createUserWithEmailAndPassword(email, pass);
    const uid = cred.user.uid;
    const uploadedUrl = await uploadPfpToS3(uid);
    await db.ref('userProfiles/'+uid).set({ username, email, pfp: uploadedUrl||'', createdAt: Date.now(), isAnonymous: false });
    await cred.user.updateProfile({ displayName: username, photoURL: uploadedUrl||'' });
    sessionStorage.setItem('wc_uid', uid);
    sessionStorage.setItem('wc_username', username);
    sessionStorage.setItem('wc_pfp', uploadedUrl||'');
    sessionStorage.setItem('wc_anon', 'false');
    window.location.href = 'index.html';
  } catch(e){
    showErr(e.message.replace('Firebase: ','').replace(/\(auth.*\)/,'').trim());
    btn.disabled=false; btn.innerHTML='<span class="material-icons-round">cell_tower</span> Create Account';
  }
}

async function googleAuth(){
  const provider = new firebase.auth.GoogleAuthProvider();
  try {
    const res = await auth.signInWithPopup(provider);
    const uid = res.user.uid;
    const isNew = res.additionalUserInfo.isNewUser;
    const username = res.user.displayName || 'User'+uid.slice(0,5);
    const pfp = res.user.photoURL || '';
    if(isNew){ await db.ref('userProfiles/'+uid).set({ username, email: res.user.email||'', pfp, createdAt: Date.now(), isAnonymous: false }); }
    sessionStorage.setItem('wc_uid', uid);
    sessionStorage.setItem('wc_username', username);
    sessionStorage.setItem('wc_pfp', pfp);
    sessionStorage.setItem('wc_anon', 'false');
    window.location.href = 'index.html';
  } catch(e){ showErr('Google sign-in failed: '+e.message); }
}
</script>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
</body>
</html>
