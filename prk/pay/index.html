<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Slot Verification Panel</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
    import { getDatabase, ref, get, update, remove } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAoTJC7m08ReZb8pn-SGn2StYnU2joGiI4",
      authDomain: "parkinexit.firebaseapp.com",
      databaseURL: "https://parkin-50303-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "parkinexit",
      storageBucket: "parkinexit.firebasestorage.app",
      messagingSenderId: "329975993199",
      appId: "1:329975993199:web:8c07ec4b42f108dcf4ce9a",
      measurementId: "G-3KQ5SL6BXZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    async function freePendingSlot() {
      const snapshot = await get(ref(db, "exit_requests"));
      if (!snapshot.exists()) {
        alert("No pending requests found!");
        return;
      }

      const data = snapshot.val();
      const pending = Object.keys(data).find(k => data[k].status === "pending");
      if (!pending) {
        alert("No pending requests found!");
        return;
      }

      const code = pending;
      const floor = code[0];
      const floorRef = ref(db, `parking/${floor}`);
      const floorSnap = await get(floorRef);

      if (!floorSnap.exists()) {
        alert(`Floor ${floor} not found in database.`);
        return;
      }

      const floorData = floorSnap.val();
      const parked = floorData.parked_slots || [];
      const free = floorData.free_slots || [];

      if (!parked.includes(code)) {
        alert(`Slot ${code} is not currently parked.`);
        await remove(ref(db, `exit_requests/${code}`));
        return;
      }

      const newParked = parked.filter(s => s !== code);
      const newFree = [...free, code].sort((a,b) => parseInt(a.slice(1)) - parseInt(b.slice(1)));

      const updates = {
        parked_slots: newParked,
        free_slots: newFree,
        parked_count: newParked.length,
        free_count: newFree.length
      };

      await update(floorRef, updates);
      await update(ref(db, `exit_requests/${code}`), { status: "done", timestamp: Date.now() });

      alert(`Slot ${code} freed successfully!`);
    }

    window.freePendingSlot = freePendingSlot;
  </script>

  <style>
    body {
      background-color: #000010;
      color: white;
      font-family: 'Funnel Display', sans-serif;
      text-align: center;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    button {
      font-size: 2em;
      padding: 30px 80px;
      border: 2px solid #333;
      background: transparent;
      color: white;
      border-radius: 12px;
      cursor: pointer;
    }
    button:hover {
      color: #aaa;
    }
  </style>
</head>
<body>
  <h1></h1>
  <p>Press teh paid button to open the exit gate</p>
  <button onclick="freePendingSlot()">Paid</button>
</body>
</html>
