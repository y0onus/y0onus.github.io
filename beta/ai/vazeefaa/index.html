<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vazeefaa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0" />
<style>
  :root{
    --ink:#2C2A32;
    --ink-soft:#736F7C;
    --paper:#FFFFFF;
    --cloud:#FAF9FC;
    --line:#ECE9F1;

    --lagoon:#3FB6AE;
    --lagoon-deep:#2C948D;
    --coral:#FF9E80;

    --indigo:#3A1AD6;
    --indigo-deep:#2A0FB0;

    --glass-border:rgba(255,255,255,0.55);
    --glass-shadow:0 8px 32px rgba(31,25,90,0.14);

    --mint:#DBF3E7;
    --mint-ink:#1F7A5C;
    --sky:#DEEBFB;
    --sky-ink:#2565A6;
    --peach:#FFE7D3;
    --peach-ink:#B25A22;
    --lav:#EAE3F8;
    --lav-ink:#6B4FA0;
    --blush:#FCE1E6;
    --blush-ink:#B23F5C;

    --shadow-sm: 0 2px 10px rgba(44,42,50,0.06);
    --shadow-md: 0 10px 30px rgba(44,42,50,0.08);
    --shadow-lg: 0 20px 60px rgba(44,42,50,0.12);
    --radius: 22px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cloud);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  .msym{
    font-family:'Material Symbols Outlined';
    font-weight:400;
    font-style:normal;
    font-size:22px;
    line-height:1;
    display:inline-block;
    vertical-align:middle;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    letter-spacing:0.2px;
  }
  a{color:inherit;}
  button{font-family:inherit;}

  /* ---------- Ambient mesh-gradient background ---------- */
  .ambient{
    position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none;
    background:#ffffff;
  }
  .mesh-bg{
    position:absolute; inset:-10%; 
    background:
      radial-gradient(ellipse 55% 45% at 88% 6%,  rgba(255,150,110,0.75), transparent 62%),
      radial-gradient(ellipse 50% 45% at 100% 46%, rgba(255,140,165,0.60), transparent 60%),
      radial-gradient(ellipse 60% 50% at 62% 100%, rgba(120,225,165,0.60), transparent 60%),
      radial-gradient(ellipse 55% 45% at 6% 96%,   rgba(170,235,195,0.55), transparent 60%),
      radial-gradient(ellipse 45% 40% at 100% 100%,rgba(205,190,245,0.45), transparent 60%),
      radial-gradient(ellipse 45% 40% at 0% 10%,   rgba(190,225,255,0.40), transparent 60%),
      radial-gradient(ellipse 60% 55% at 45% 45%,  rgba(255,255,255,0.9), transparent 65%);
    animation:meshDrift 22s ease-in-out infinite;
  }
  @keyframes meshDrift{
    0%,100%{ transform:translate(0,0) scale(1); }
    50%{ transform:translate(-1.5%,1.5%) scale(1.03); }
  }

  /* ---------- Section shell ---------- */
  section{ position:relative; z-index:2; padding:10px 6vw 70px; }
  .section-head{ text-align:center; max-width:640px; margin:0 auto 34px; }
  .section-head h2{ font-size:clamp(1.6rem,2.6vw,2.1rem); margin:0 0 10px; }
  .section-head p{ color:var(--ink-soft); font-size:0.98rem; margin:0; }

  /* ---------- Welcome screen (Gemini-style) ---------- */
  #welcome-screen{
    min-height:92vh; display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-end;
    text-align:left; gap:26px; padding:40px 8vw 64px; transition:opacity .5s ease, transform .5s ease;
  }
  #welcome-screen.hide{ opacity:0; transform:translateY(-24px) scale(0.98); pointer-events:none; position:absolute; inset:0; }
  .welcome-greeting{
    font-family:'Playfair Display', serif; font-weight:600; font-size:clamp(2.1rem,6.4vw,3.4rem);
    line-height:1.18; margin:0; color:var(--ink); max-width:11ch; letter-spacing:0.2px;
  }
  .welcome-sub{ color:var(--ink-soft); font-size:0.98rem; max-width:400px; margin:0; line-height:1.5; }
  .welcome-start{ margin-top:6px; }
  .welcome-hints{ display:flex; flex-wrap:wrap; gap:10px; justify-content:flex-start; max-width:600px; }
  .welcome-hint{
    display:flex; align-items:center; gap:8px; border:1.5px solid var(--glass-border); background:rgba(255,255,255,0.45);
    backdrop-filter:blur(10px) saturate(160%); -webkit-backdrop-filter:blur(10px) saturate(160%);
    border-radius:16px; padding:12px 16px; font-size:0.85rem; font-weight:600;
    color:var(--ink-soft); cursor:pointer; transition:all .25s;
  }
  .welcome-hint:hover{ border-color:var(--indigo); color:var(--indigo-deep); transform:translateY(-2px); box-shadow:var(--shadow-sm); }
  .welcome-hint .msym{ font-size:18px; color:var(--indigo); }

  /* ---------- Chat (one full-page step at a time) ---------- */
  #chat-section{ display:none; }
  #chat-section.show{ display:block; animation:stepIn .5s ease; }
  .chat-shell{ max-width:720px; margin:0 auto; padding:0 6vw; }
  @media(min-width:600px){ .chat-shell{ padding:0 20px; } }
  .chat-window{ display:flex; flex-direction:column; }

  .chat-step{
    min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column;
    padding:34px 0 150px;
    box-sizing:border-box;
    animation:stepIn .45s cubic-bezier(.22,1,.36,1);
  }
  .step-header .msg-bubble + .msg-bubble{ margin-top:20px; }
  .step-body{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:16px; padding-top:40px; }
  .step-options{ display:flex; flex-wrap:wrap; gap:10px; }

  .chat-bar{
    display:none; position:fixed; left:0; right:0; bottom:0; z-index:40;
    padding:14px 6vw calc(14px + env(safe-area-inset-bottom));
  }
  @media(min-width:600px){ .chat-bar{ padding-left:20px; padding-right:20px; } }
  .chat-bar-inner{ max-width:720px; margin:0 auto; display:flex; gap:10px; align-items:center; }
  .chat-bar-inner .chip-input, .chat-bar-inner input[type=text]{ flex:1; margin:0; }
  .chat-bar-submit{
    width:52px; height:52px; border-radius:50%; border:none; flex-shrink:0;
    background:var(--indigo); color:#fff; display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:0 8px 20px rgba(58,26,214,0.35); transition:transform .2s, background .2s;
  }
  .chat-bar-submit:hover{ background:var(--indigo-deep); transform:translateY(-2px); }
  .chat-bar-submit .msym{ font-size:22px; }

  .msg{ display:flex; gap:12px; max-width:100%; animation:msgIn .45s cubic-bezier(.22,1,.36,1); }
  @keyframes msgIn{ from{ opacity:0; transform:translateY(14px) scale(0.98);} to{ opacity:1; transform:translateY(0) scale(1);} }
  .msg.user{ flex-direction:row-reverse; }
  .msg-avatar{ display:none; }
  .msg.user .msg-avatar{
    display:flex; width:34px; height:34px; border-radius:50%; flex-shrink:0;
    align-items:center; justify-content:center;
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:0.85rem; color:#fff;
    background:var(--ink);
  }
  .msg-col{ display:flex; flex-direction:column; gap:10px; max-width:88%; }
  .msg.user .msg-col{ align-items:flex-end; max-width:82%; }
  .msg-bubble{
    background:transparent; color:var(--ink);
    border-radius:0; padding:0; line-height:1.5; font-size:1.1rem; font-weight:600;
    box-shadow:none;
  }
  .msg.user .msg-bubble{ background:var(--ink); color:#fff; border-radius:18px 18px 4px 18px; padding:13px 17px; font-size:0.95rem; font-weight:400; box-shadow:none; }

  .typing-dots{ display:flex; gap:4px; padding:16px 18px; }
  .typing-dots span{ width:6px; height:6px; border-radius:50%; background:var(--ink-soft); animation:blinkDot 1.2s infinite; }
  .typing-dots span:nth-child(2){ animation-delay:.2s; }
  .typing-dots span:nth-child(3){ animation-delay:.4s; }
  @keyframes blinkDot{ 0%,80%,100%{ opacity:.25; } 40%{ opacity:1; } }

  .option-row{ display:flex; flex-wrap:wrap; gap:10px; }
  .option-btn{
    display:inline-flex; align-items:center; gap:8px;
    border:1.5px solid rgba(44,42,50,0.14); background:rgba(255,255,255,0.5); color:var(--ink);
    backdrop-filter:blur(10px) saturate(160%); -webkit-backdrop-filter:blur(10px) saturate(160%);
    border-radius:999px; padding:11px 18px; font-weight:600; font-size:0.87rem;
    cursor:pointer; transition:all .25s cubic-bezier(.22,1,.36,1); font-family:inherit;
    animation:msgIn .4s cubic-bezier(.22,1,.36,1) backwards;
  }
  .option-btn .msym{ font-size:17px; color:var(--ink-soft); transition:color .25s; }
  .option-btn:hover:not(:disabled){ border-color:var(--indigo); color:var(--indigo-deep); transform:translateY(-2px) scale(1.02); box-shadow:var(--shadow-sm); }
  .option-btn.picked{ background:var(--indigo); border-color:var(--indigo); color:#fff; }
  .option-btn.picked .msym{ color:#fff; }
  .option-btn:disabled{ cursor:default; opacity:0.5; }
  .option-btn:disabled:not(.picked){ display:none; }

  /* ---------- Bento-style option cards (used for steps with no bottom chat bar) ---------- */
  .bento-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
  .bento-card{
    display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-end; gap:12px;
    border:1.5px solid rgba(44,42,50,0.14); background:rgba(255,255,255,0.45); color:var(--ink);
    backdrop-filter:blur(14px) saturate(170%); -webkit-backdrop-filter:blur(14px) saturate(170%);
    border-radius:26px; padding:22px; min-height:130px; text-align:left;
    font-weight:700; font-size:1rem; line-height:1.3; font-family:inherit;
    cursor:pointer; transition:all .25s cubic-bezier(.22,1,.36,1);
    animation:msgIn .4s cubic-bezier(.22,1,.36,1) backwards;
    box-shadow:var(--shadow-sm);
  }
  .bento-card .msym{ font-size:30px; color:var(--indigo); transition:color .25s; }
  .bento-card:hover:not(:disabled){ transform:translateY(-4px) scale(1.015); box-shadow:var(--shadow-md); border-color:var(--indigo); }
  .bento-card.picked{ background:var(--indigo); border-color:var(--indigo); color:#fff; box-shadow:0 14px 30px rgba(58,26,214,0.35); }
  .bento-card.picked .msym{ color:#fff; }
  .bento-card:disabled{ cursor:default; opacity:0.5; }
  .bento-card:disabled:not(.picked){ display:none; }
  .bento-card.wide{ grid-column:span 2; flex-direction:row; align-items:center; justify-content:flex-start; min-height:88px; }

  .chat-input-row{ display:flex; gap:8px; }
  .chat-input-row input{ flex:1; }

  .chip-input{
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    border:1.5px solid rgba(44,42,50,0.14); border-radius:999px; padding:12px 18px; min-height:56px;
    transition:border-color .2s; background:rgba(255,255,255,0.5);
    backdrop-filter:blur(10px) saturate(160%); -webkit-backdrop-filter:blur(10px) saturate(160%);
  }
  .chip-input:focus-within{ border-color:var(--indigo); }
  .chip-input input{
    border:none; outline:none; flex:1; min-width:140px; font-size:0.98rem; padding:6px; font-family:inherit;
    background:transparent; color:var(--ink);
  }
  .chip-input input::placeholder{ color:#B7B3BF; }
  .chip{
    background:var(--mint); color:var(--mint-ink); font-weight:600; font-size:0.82rem;
    padding:7px 8px 7px 12px; border-radius:999px; display:flex; align-items:center; gap:6px;
    animation:popIn .3s cubic-bezier(.22,1,.36,1);
  }
  @keyframes popIn{ from{ transform:scale(0.6); opacity:0;} to{ transform:scale(1); opacity:1;} }
  .chip .x{ cursor:pointer; font-size:16px; opacity:0.7; }
  .chip .x:hover{ opacity:1; }

  input[type=text], input[type=number]{
    border:1.5px solid rgba(44,42,50,0.14); border-radius:999px; padding:13px 18px;
    font-size:0.95rem; font-family:inherit; color:var(--ink); background:rgba(255,255,255,0.5); outline:none;
    backdrop-filter:blur(10px) saturate(160%); -webkit-backdrop-filter:blur(10px) saturate(160%);
    transition:border-color .2s;
  }
  input:focus{ border-color:var(--indigo); }

  .btn{
    border:none; border-radius:999px; padding:13px 24px; font-weight:700; font-size:0.92rem;
    cursor:pointer; display:inline-flex; align-items:center; gap:8px; transition:all .25s cubic-bezier(.22,1,.36,1);
  }

  .btn-primary{ background:var(--ink); color:#fff; }
  .btn-primary:hover{ transform:translateY(-2px); box-shadow:var(--shadow-md); }
  .btn-ghost{ background:transparent; color:var(--ink-soft); }
  .btn-ghost:hover{ color:var(--ink); }
  .btn-lagoon{ background:var(--indigo); color:#fff; padding:15px 30px; font-size:0.98rem; box-shadow:0 10px 26px rgba(58,26,214,0.35); }
  .btn-lagoon:hover{ background:var(--indigo-deep); transform:translateY(-2px); box-shadow:0 12px 28px rgba(58,26,214,0.42); }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; transform:none !important; box-shadow:none !important; }
  .welcome-start .msym{ display:none; }

  @keyframes stepIn{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }

  /* ---------- Results ---------- */
  .cards-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:18px; margin-top:4px;
  }
  .job-card{
    border-radius:24px; padding:22px; position:relative; overflow:hidden;
    box-shadow:var(--glass-shadow); transition:transform .25s, box-shadow .25s, background .25s;
    animation:cardIn .5s ease both;
    background:rgba(255,255,255,0.28);
    backdrop-filter:blur(22px) saturate(180%);
    -webkit-backdrop-filter:blur(22px) saturate(180%);
    border:1px solid var(--glass-border);
  }
  /* subtle glass highlight along the top edge */
  .job-card::before{
    content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:linear-gradient(160deg, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0) 30%);
    mix-blend-mode:overlay;
  }
  .job-card:hover{ transform:translateY(-6px); box-shadow:0 16px 44px rgba(31,25,90,0.2); background:rgba(255,255,255,0.38); }
  @keyframes cardIn{ from{ opacity:0; transform:translateY(18px) scale(0.98);} to{ opacity:1; transform:translateY(0) scale(1);} }

  .job-card .top-row{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; position:relative; z-index:1; }
  .job-card .source-tag{
    font-size:0.68rem; font-weight:800; letter-spacing:0.4px; text-transform:uppercase;
    background:rgba(255,255,255,0.4); border:1px solid rgba(255,255,255,0.5);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    padding:5px 10px; border-radius:999px;
  }
  .match-ring{ position:relative; width:56px; height:56px; flex-shrink:0; }
  .match-ring svg{ transform:rotate(-90deg); width:56px; height:56px; }
  .match-ring circle{ fill:none; stroke-width:5; }
  .match-ring .bg{ stroke:rgba(255,255,255,0.45); }
  .match-ring .fg{ stroke:var(--ink); stroke-linecap:round; transition:stroke-dashoffset 1s cubic-bezier(.65,0,.35,1); }
  .match-ring .val{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:0.78rem;
  }

  .job-card h4{ margin:0 0 6px; font-size:1.12rem; font-family:'Baloo 2',sans-serif; position:relative; z-index:1; }
  .job-card .company{ font-weight:600; font-size:0.9rem; margin-bottom:12px; opacity:0.85; display:flex; align-items:center; gap:6px; position:relative; z-index:1; }
  .job-card .meta-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; position:relative; z-index:1; }
  .meta-pill{
    background:rgba(255,255,255,0.38); border:1px solid rgba(255,255,255,0.5);
    backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    padding:6px 11px; border-radius:999px;
    font-size:0.75rem; font-weight:600; display:flex; align-items:center; gap:5px;
  }
  .meta-pill .msym{ font-size:15px; }

  .job-card .skill-line{ font-size:0.78rem; opacity:0.8; margin-bottom:18px; line-height:1.5; position:relative; z-index:1; }
  .job-card .skill-line b{ display:block; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.4px; margin-bottom:4px; opacity:0.7; }

  .apply-btn{
    width:100%; border:none; border-radius:14px; padding:13px; font-weight:800; font-size:0.9rem;
    background:var(--ink); color:#fff; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
    position:relative; overflow:hidden; transition:transform .15s; z-index:1;
  }
  .apply-btn:active{ transform:scale(0.97); }
  .apply-btn .fill-anim{
    position:absolute; left:0; top:0; bottom:0; width:0%; background:var(--indigo); z-index:0; transition:width .7s cubic-bezier(.5,0,.2,1);
  }
  .apply-btn span, .apply-btn .msym{ position:relative; z-index:1; }
  .apply-btn.launching .fill-anim{ width:100%; }

  .job-card.c-mint{ background:linear-gradient(160deg, rgba(219,243,231,0.55), rgba(255,255,255,0.2)); color:var(--mint-ink); }
  .job-card.c-sky{ background:linear-gradient(160deg, rgba(222,235,251,0.55), rgba(255,255,255,0.2)); color:var(--sky-ink); }
  .job-card.c-peach{ background:linear-gradient(160deg, rgba(255,231,211,0.55), rgba(255,255,255,0.2)); color:var(--peach-ink); }
  .job-card.c-lav{ background:linear-gradient(160deg, rgba(234,227,248,0.55), rgba(255,255,255,0.2)); color:var(--lav-ink); }
  .job-card.c-blush{ background:linear-gradient(160deg, rgba(252,225,230,0.55), rgba(255,255,255,0.2)); color:var(--blush-ink); }
  .job-card .match-ring .val, .job-card .company, .job-card h4{ color:inherit; }
  .job-card h4{ color:var(--ink); }

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
  }
  .empty-state .msym{ font-size:52px; color:var(--line); margin-bottom:14px; }

  footer{
    display:none; text-align:center; padding:20px 6vw 50px; color:var(--ink-soft); font-size:0.8rem;
    position:relative; z-index:2;
  }
  footer.show{ display:block; animation:msgIn .4s ease; }

  /* confetti */
  .confetti-piece{
    position:fixed; top:-10px; width:8px; height:14px; z-index:999; pointer-events:none;
    border-radius:2px; animation:confettiFall 1.1s ease-in forwards;
  }
  @keyframes confettiFall{
    to{ transform:translateY(105vh) rotate(540deg); opacity:0; }
  }

  /* toast */
  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:14px 22px; border-radius:14px; font-size:0.88rem;
    display:flex; align-items:center; gap:10px; opacity:0; transition:all .35s; z-index:1000; font-weight:600;
    box-shadow:var(--shadow-lg);
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  .toast .msym{ color:var(--lagoon); }

  @media(prefers-reduced-motion:reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }
</style>
</head>
<body>

<div class="ambient">
  <div class="mesh-bg"></div>
</div>

<section id="welcome-screen">
  <h1 class="welcome-greeting" id="welcome-greeting">Hi there.</h1>
  <p class="welcome-sub" id="welcome-sub">Let's find a job that actually fits you — a few quick questions, then I'll bring back real openings from Maldives job boards.</p>
  <button class="btn btn-lagoon welcome-start" id="welcome-start">Get started <span class="msym">arrow_forward</span></button>
  <div class="welcome-hints">
    <div class="welcome-hint" data-msg="I'm looking for a resort job"><span class="msym">beach_access</span> Resort jobs</div>
    <div class="welcome-hint" data-msg="I'm looking for an office job in Male'"><span class="msym">location_city</span> Office jobs in Male'</div>
    <div class="welcome-hint" data-msg="I'm looking for a remote job"><span class="msym">laptop_mac</span> Remote work</div>
  </div>
</section>

<section id="chat-section">
  <div class="chat-shell">
    <div class="chat-window" id="chat-window"></div>
  </div>
  <div class="chat-bar" id="chat-bar"></div>
</section>

<footer id="page-footer">
  Vazeefaa &middot; a friendlier way to browse Maldives jobs
</footer>

<div class="toast" id="toast"><span class="msym">check_circle</span><span id="toast-text"></span></div>

<script>
/* ----------------------------------------------------------
   LIVE SCRAPING — runs entirely in the browser, no server of
   ours involved.

   Reality check on how this works (read before relying on it):
   - Browsers block cross-origin fetch() to sites that don't send
     CORS headers, and none of these three job boards do. So this
     routes requests through a public CORS proxy (allorigins.win)
     that fetches the page server-side and hands the raw HTML back
     with permissive CORS headers. That's still "a server" — just
     a third party's, not one we run or maintain. If that free
     proxy is down, rate-limited, or blocked, scraping for that
     source will silently fail and just contribute 0 jobs.
   - There's no official API, so this parses whatever HTML the
     listing page happens to render today by looking for links
     that match each site's job-URL pattern. Titles and links are
     dependable. Company / area / type / mode / skills are guessed
     from nearby text with simple keyword matching — they're
     best-effort, not authoritative, and will misfire sometimes.
   - If any site changes its markup, this can silently return
     fewer/no results for that source. There's no scheduling here
     either — it only refreshes on page load.
   - Scraping can also run against a site's Terms of Service —
     worth checking each board's ToS/robots.txt before relying on
     this beyond a personal prototype.
---------------------------------------------------------- */
const CORS_PROXIES = [
  { name:'allorigins', mode:'html', build: url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}` },
  { name:'codetabs',   mode:'html', build: url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}` },
  { name:'corsproxy.io', mode:'html', build: url => `https://corsproxy.io/?url=${encodeURIComponent(url)}` },
  { name:'r.jina.ai (reader)', mode:'text', build: url => `https://r.jina.ai/${url}` },
];

const SOURCES = [
  { site:"Jobsicle", listUrl:"https://jobsicle.mv/", base:"https://jobsicle.mv", linkPattern:/^\/job\//i },
  { site:"Job Center Maldives", listUrl:"https://jobcenter.mv/en/jobs", base:"https://jobcenter.mv", linkPattern:/^\/en\/jobs\/[a-z0-9-]+$/i },
  { site:"Career Maldives", listUrl:"https://career-maldives.com/jobs/", base:"https://career-maldives.com", linkPattern:/\/jobs\/[a-z0-9-]+\/?$/i },
];

  "Male' Atoll","Male'","Hulhumale'","Hulhumale","Hulhule","Vilimale","Thilafushi",
  "Addu City","Addu Atoll","Alif Alif Atoll","Alif Dhaalu Atoll","Ari Atoll","Baa Atoll",

  "Haa Alif Atoll","Haa Dhaalu Atoll","Kaafu Atoll","Laamu Atoll","Lhaviyani Atoll",
  "Meemu Atoll","Noonu Atoll","Raa Atoll","Shaviyani Atoll","Thaa Atoll","Vaavu Atoll",
].sort((a,b)=> b.length - a.length);

const SKILL_KEYWORDS = {
  "front office":["Customer service","Front desk"], "reception":["Customer service","Front desk"],
  "housekeeping":["Housekeeping","Attention to detail"], "dive":["Scuba diving","Safety training"],
  "spa":["Wellness","Customer service"], "waiter":["F&B service","Teamwork"], "chef":["Cooking","Food safety"],
  "account":["Accounting","Excel","Financial reporting"], "finance":["Financial planning","Excel"],
  "hr ":["Recruitment","HR policy"], "human resources":["Recruitment","HR policy"],
  "it support":["IT support","Troubleshooting"], "network":["Networking","IT support"],
  "software":["Software development","Problem solving"], "developer":["Software development","Problem solving"],
  "sales":["Sales","Negotiation","Customer service"], "marketing":["Digital marketing","Social media"],
  "content":["Content writing","SEO"], "design":["Graphic design","Creativity"],
  "warehouse":["Inventory management","Organisation"], "logistics":["Logistics","Organisation"],
  "teacher":["Teaching","Classroom management"], "engineer":["Engineering","Problem solving"],
  "security":["Security","Vigilance"], "driver":["Driving","Time management"],
  "construction":["Construction","Physical stamina"], "captain":["Marine operations","Leadership"],
  "manager":["Leadership","Planning"], "customer service":["Customer service","Communication"],
};

function guessArea(text){
  const found = AREA_LIST.find(a => text.toLowerCase().includes(a.toLowerCase()));
  return found || "Any";
}
function guessPosted(text){
  const m = text.match(/(\d+)\s*(hour|day|week|month)s?\s*ago/i);
  return m ? m[0] : "Recently";
}
const COMPANY_SUFFIXES = /(Pvt\.?\s?Ltd|LLC|LLP|Ltd|Resort(?:\s*&\s*Spa)?|Hotel|Guesthouse|Group|Trading|Enterprises|Company|Co\.|Inc|Maldives|School|Hospital|Clinic)/i;
function guessCompany(text, title){
  // 1) look for a capitalised phrase ending in a recognisable business suffix
  const suffixMatch = text.match(new RegExp(`([A-Z][A-Za-z&'.,\\- ]{2,55}${COMPANY_SUFFIXES.source})`));
  if(suffixMatch) return suffixMatch[1].trim();

  // 2) otherwise look at whatever text immediately follows the job title in
  // the card and see if it looks like a name (not a date/location/duration)
  const idx = text.indexOf(title);
  if(idx !== -1){
    const after = text.slice(idx + title.length, idx + title.length + 80);
    const candidate = after.split(/[•·|\-]/)[0].replace(/^[\s,]+/, '').trim();
    const looksLikeNoise = /^\d|ago$|^(full|part)[\s-]?time$|remote|hybrid|onsite/i.test(candidate);
    if(candidate.length > 2 && candidate.length < 60 && !looksLikeNoise && !AREA_LIST.some(a=>candidate.toLowerCase()===a.toLowerCase())){
      return candidate;
    }
  }

  // 3) give up honestly rather than mislabeling the source site as the employer
  return null;
}
function guessType(text){
  if(/part[\s-]?time/i.test(text)) return "Part-time";
  if(/intern/i.test(text)) return "Intern";
  if(/freelance/i.test(text)) return "Freelance";
  return "Full-time";
}
function guessMode(text){
  if(/remote/i.test(text)) return "Remote";
  if(/hybrid/i.test(text)) return "Hybrid";
  return "Onsite";
}
function guessSkills(title){
  const t = title.toLowerCase();
  const tags = new Set();
  for(const [kw, sk] of Object.entries(SKILL_KEYWORDS)){
    if(t.includes(kw)) sk.forEach(s=>tags.add(s));
  }
  if(tags.size === 0) tags.add("Communication");
  return [...tags];
}

async function fetchViaProxy(url){
  const attemptErrors = [];

  const attempt = (proxy) => (async () => {
    try{
      const res = await fetch(proxy.build(url), { signal: AbortSignal.timeout(9000) });
      if(!res.ok){
        const e = new Error(`${proxy.name}: HTTP ${res.status}`);
        console.warn(`[${proxy.name}] HTTP ${res.status} for`, url);
        throw e;
      }
      const text = await res.text();
      if(!text || text.length < 200){
        const e = new Error(`${proxy.name}: empty/short response`);
        console.warn(`[${proxy.name}] empty/short response for`, url);
        throw e;
      }
      return { content: text, mode: proxy.mode, via: proxy.name };
    }catch(err){
      const msg = (err && err.message) || `${proxy.name}: network error`;
      attemptErrors.push(msg);
      console.warn(`[${proxy.name}] failed for`, url, err);
      throw err;
    }
  })();

  try{
    // race every proxy at once — first one to succeed wins, so a single
    // slow/dead proxy (e.g. allorigins having an outage) can't stall the rest
    return await Promise.any(CORS_PROXIES.map(attempt));
  }catch(aggregateErr){
    throw new Error(attemptErrors.join('; ') || 'all proxies failed');
  }
}

function absUrl(u, base){
  if(!u) return null;
  try{ return new URL(u, base).href; } catch(e){ return null; }
}

function extractJobsFromHTML(html, source){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  if(source.site === 'Jobsicle') return parseJobsicleHTML(doc, source);
  if(source.site === 'Job Center Maldives') return parseJobCenterHTML(doc, source);
  return parseGenericHTML(doc, source);
}

// ---- Jobsicle: rows are <button id="job-row-{i}-{jobId}">, job title and
// company both live in <span>s inside the button; company span carries
// class "font-medium text-neutral-700". There's no plain <a href> on the
// row in the static HTML, so the detail URL is reconstructed from the
// numeric id in the button's id attribute — this is a best-effort guess
// (falls back to the listing page itself if nothing better is found).
function parseJobsicleHTML(doc, source){
  const jobs = [];
  const seen = new Set();

  doc.querySelectorAll('button[id^="job-row-"]').forEach(btn=>{
    const spans = [...btn.querySelectorAll('span')];
    if(spans.length === 0) return;

    const companySpan = spans.find(s => /font-medium/.test(s.className) && /text-neutral-700/.test(s.className));
    const company = companySpan ? companySpan.textContent.replace(/\s+/g,' ').trim() : null;

    const titleSpan = spans.find(s => s !== companySpan && s.textContent.trim().length > 2);
    const title = titleSpan ? titleSpan.textContent.replace(/\s+/g,' ').trim() : null;
    if(!title) return;

    // prefer a real link if one exists anywhere on the row, else guess from the id
    let href = null;
    const linkEl = btn.querySelector('a[href]') || btn.closest('a[href]');
    if(linkEl) href = absUrl(linkEl.getAttribute('href'), source.base);
    if(!href){
      const idMatch = btn.id.match(/(\d+)$/);
      if(idMatch) href = `${source.base}/job/${idMatch[1]}`;
    }
    if(!href || seen.has(href)) return;
    seen.add(href);

    const context = btn.textContent.replace(/\s+/g,' ').trim();
    jobs.push({
      id: href, title, company, logoUrl: null,
      area: guessArea(context), type: guessType(context), mode: guessMode(context),
      minYears: 0, skills: guessSkills(title),
      site: source.site, url: href, posted: guessPosted(context),
    });
  });

  return jobs.slice(0, 40);
}

// ---- Job Center Maldives: each job link is an <a href="/en/jobs/..."
// title="Job Title">, and inside it the company name and logo both sit in
// their own ".mb-2" blocks — one holds an <img class="img-fluid h-md">,
// the other holds the plain-text business name.
function parseJobCenterHTML(doc, source){
  const jobs = [];
  const seen = new Set();

  doc.querySelectorAll('a[href]').forEach(a=>{
    let path;
    try{ path = new URL(a.getAttribute('href'), source.base).pathname; }
    catch(e){ return; }
    if(!source.linkPattern.test(path)) return;

    const href = absUrl(a.getAttribute('href'), source.base);
    if(!href || seen.has(href)) return;

    const title = (a.getAttribute('title') || a.textContent || '').replace(/\s+/g,' ').trim();
    if(title.length < 3) return;
    seen.add(href);

    // .mb-2 blocks may sit inside the <a> or on a sibling within the same card
    let scope = a.querySelectorAll('.mb-2').length ? a : (a.closest('.mb-2') ? a.parentElement : a.parentElement);
    let mb2s = [...scope.querySelectorAll('.mb-2')];
    if(mb2s.length === 0 && a.parentElement) mb2s = [...a.parentElement.querySelectorAll('.mb-2')];

    let company = null, logoUrl = null;
    mb2s.forEach(el=>{
      const img = el.querySelector('img.img-fluid.h-md, img.h-md.img-fluid, img');
      if(img && !logoUrl) logoUrl = absUrl(img.getAttribute('src'), source.base);
      const txt = el.textContent.replace(/\s+/g,' ').trim();
      if(!company && txt && txt !== title && txt.length > 1 && txt.length < 80) company = txt;
    });

    const context = (a.closest('.mb-2') ? a.parentElement : a).textContent.replace(/\s+/g,' ').trim();
    jobs.push({
      id: href, title, company, logoUrl,
      area: guessArea(context), type: guessType(context), mode: guessMode(context),
      minYears: 0, skills: guessSkills(title),
      site: source.site, url: href, posted: guessPosted(context),
    });
  });

  return jobs.slice(0, 40);
}

// ---- Career Maldives: no confirmed DOM details yet, so this stays on the
// generic href + surrounding-text heuristic until we know its real markup.
function parseGenericHTML(doc, source){
  const seen = new Set();
  const jobs = [];

  [...doc.querySelectorAll('a[href]')].forEach(a=>{
    let path;
    try{ path = new URL(a.getAttribute('href'), source.base).pathname; }
    catch(e){ return; }
    if(!source.linkPattern.test(path)) return;

    const title = a.textContent.replace(/\s+/g,' ').trim();
    if(title.length < 3) return;

    const href = absUrl(a.getAttribute('href'), source.base);
    if(!href || seen.has(href)) return;
    seen.add(href);

    let node = a, context = '';
    for(let i=0;i<4 && node.parentElement;i++){
      node = node.parentElement;
      context = node.textContent.replace(/\s+/g,' ').trim();
      if(context.length > title.length + 15) break;
    }

    jobs.push({
      id: href,
      title,
      company: guessCompany(context, title),
      logoUrl: null,
      area: guessArea(context),
      type: guessType(context),
      mode: guessMode(context),
      minYears: 0,
      skills: guessSkills(title),
      site: source.site,
      url: href,
      posted: guessPosted(context),
    });
  });

  return jobs.slice(0, 40);
}

function extractJobsFromMarkdown(text, source){
  // r.jina.ai (and similar readers) return markdown-ish text with [label](url) links
  const seen = new Set();
  const jobs = [];
  const linkRe = /\[([^\]\n]{3,120})\]\((https?:\/\/[^\s)]+)\)/g;
  let m;
  while((m = linkRe.exec(text)) !== null){
    const [full, label, href] = m;
    let path;
    try{ path = new URL(href).pathname; } catch(e){ continue; }
    if(!source.linkPattern.test(path)) continue;

    const title = label.replace(/\s+/g,' ').trim();
    if(title.length < 3 || seen.has(href)) continue;
    seen.add(href);

    // grab a window of surrounding plain text as context for the guessers
    const start = Math.max(0, m.index - 20);
    const end = Math.min(text.length, m.index + full.length + 200);
    const context = text.slice(start, end).replace(/\s+/g,' ');

    jobs.push({
      id: href,
      title,
      company: guessCompany(context, title),
      logoUrl: null,
      area: guessArea(context),
      type: guessType(context),
      mode: guessMode(context),
      minYears: 0,
      skills: guessSkills(title),
      site: source.site,
      url: href,
      posted: guessPosted(context),
    });
  }
  return jobs.slice(0, 40);
}

async function scrapeSource(source){
  try{
    const { content, mode, via } = await fetchViaProxy(source.listUrl);
    const jobs = mode === 'text'
      ? extractJobsFromMarkdown(content, source)
      : extractJobsFromHTML(content, source);
    if(jobs.length === 0){
      return { site: source.site, jobs: [], error: `fetched via ${via} but no job links matched — markup may have changed` };
    }
    return { site: source.site, jobs, error: null };
  }catch(err){
    console.warn('Live scrape failed for', source.site, err);
    return { site: source.site, jobs: [], error: (err && err.message) || 'fetch failed' };
  }
}

async function scrapeAllJobs(){
  const perSource = await Promise.all(SOURCES.map(scrapeSource));
  return {
    jobs: perSource.flatMap(r => r.jobs),
    statuses: perSource.map(r => ({ site: r.site, count: r.jobs.length, error: r.error })),
  };
}

async function initJobs(){
  const { jobs, statuses } = await scrapeAllJobs();
  JOBS = jobs;

  const statusEl = document.getElementById('scrape-status');
  if(statusEl){
    const parts = statuses.map(s => s.error ? `${s.site}: 0 (${s.error})` : `${s.site}: ${s.count}`);
    statusEl.innerHTML = `${parts.join(' &middot; ')}. `
      + (JOBS.length ? '' : 'All three came back empty — likely the free CORS proxy is rate-limited right now. ')
      + `<a href="#" id="retry-scrape" style="color:var(--lagoon-deep); font-weight:700;">Retry scrape</a>`;
    const retryLink = document.getElementById('retry-scrape');
    if(retryLink) retryLink.onclick = (e)=>{ e.preventDefault(); initJobs(); };
  }

  ALL_SKILLS = [...new Set(JOBS.flatMap(j=>j.skills))].sort();
  ALL_TITLES = [...new Set(JOBS.map(j=>j.title))].sort();
  return { count: JOBS.length, statuses };
}

function renderStep(headerHTML, bodyHTML, barHTML){

  chatWindow.innerHTML = `<div class="chat-step"><div class="step-header">${headerHTML}</div><div class="step-body">${bodyHTML || ''}</div></div>`;

  else { chatBar.innerHTML = ''; chatBar.style.display = 'none'; }

  return chatWindow.querySelector('.chat-step');

/* Builds bento-grid card HTML. Last card spans full width when the count is
   odd, so tiles never leave an awkward empty gap in the grid. */
function bentoCardsHtml(items){
  return items.map((o,i)=>{
    const wide = (i === items.length-1) && (items.length % 2 === 1);
    return `<button type="button" class="bento-card${wide ? ' wide' : ''}" data-val="${o.value}" style="animation-delay:${i*0.05}s"><span class="msym">${o.icon}</span><span>${o.label}</span></button>`;
  }).join('');
}

    btn.addEventListener('click', ()=>{
      step.querySelectorAll('.bento-card').forEach(b=>b.disabled = true);

];


function askSkillsStep(){
  const introHTML = `<div class="msg-bubble">${isRestart ? pick(RESTART_LINES) : pick(GREETING_LINES)}</div><div class="msg-bubble">${pick(SKILLS_INTROS)}</div>`;
  const suggestHtml = COMMON_SKILLS.map(sk=>`<button type="button" class="option-btn" data-sk="${sk}"><span class="msym">add_circle</span>${sk}</button>`).join('');
  const step = renderStep(
    introHTML,
    `<div class="step-options" id="chat-skills-suggests">${suggestHtml}</div>`,
    `<div class="chat-bar-inner">
       <div class="chip-input" id="chat-skills-wrap"><input type="text" id="chat-skills-input" placeholder="Type a skill and press Enter"></div>
       <button type="button" class="chat-bar-submit" id="chat-skills-done" title="Done adding skills"><span class="msym">arrow_forward</span></button>
     </div>`
  );

  const wrap = document.getElementById('chat-skills-wrap');
  const input = document.getElementById('chat-skills-input');
  const suggestWrap = step.querySelector('#chat-skills-suggests');
  let localSkills = [...chatAnswers.skills];

  function renderChips(){
    [...wrap.querySelectorAll('.chip')].forEach(c=>c.remove());
    localSkills.forEach(sk=>{
      const chip = document.createElement('div'); chip.className='chip';
      chip.innerHTML = `<span></span><span class="msym x">close</span>`;
      chip.querySelector('span').textContent = sk;
      chip.querySelector('.x').onclick = ()=>{ localSkills = localSkills.filter(s=>s!==sk); renderChips(); };
      wrap.insertBefore(chip, input);
    });
  }
  function addSkill(val){
    val = val.trim();
    if(!val) return;
    if(!localSkills.map(s=>s.toLowerCase()).includes(val.toLowerCase())){
      localSkills.push(val); renderChips();
    }
    input.value = '';
  }
  renderChips();
  input.addEventListener('keydown', e=>{
    if(e.key === 'Enter' || e.key === ','){ e.preventDefault(); addSkill(input.value); }
  });
  suggestWrap.querySelectorAll('.option-btn').forEach(btn=>{
    btn.addEventListener('click', ()=> addSkill(btn.dataset.sk));
  });

  document.getElementById('chat-skills-done').addEventListener('click', ()=>{
    if(input.value.trim()) addSkill(input.value);
    chatAnswers.skills = localSkills;
    goNext();
  });
  input.focus();
}

/* ---------------- MATCHING ENGINE ---------------- */
function scoreJobs(){
  const years = Number(chatAnswers.years);
  const desiredTitle = chatAnswers.title || "";
  const area = chatAnswers.area;
  const hours = chatAnswers.hours;
  const mode = chatAnswers.mode;
  const skills = chatAnswers.skills.map(s=>s.toLowerCase());

  let results = JOBS.map(job=>{
    let score = 0;
    let skillMatchRatio = 0;
    let titleMatchRatio = 0;

    // Skills overlap - 40 pts
    if(job.skills.length && skills.length){
      const jobSkillsLower = job.skills.map(s=>s.toLowerCase());
      const matched = jobSkillsLower.filter(js => skills.some(us => js.includes(us) || us.includes(js)));
      skillMatchRatio = matched.length / job.skills.length;
      score += Math.min(1, skillMatchRatio) * 40;
    }

    // Title similarity - 25 pts
    if(desiredTitle){
      if(job.title.toLowerCase() === desiredTitle.toLowerCase()){
        titleMatchRatio = 1;
        score += 25;
      } else {
        const jt = job.title.toLowerCase().split(' ');
        const dt = desiredTitle.toLowerCase().split(' ');
        const common = jt.filter(w => dt.includes(w) && w.length > 2);
        titleMatchRatio = Math.min(1, common.length / Math.max(jt.length,1));
        score += titleMatchRatio * 22;
      }
    } else {
      score += 8; // neutral partial credit if no title chosen
    }

    // Years of experience fit - 15 pts
    if(years >= job.minYears) score += 15;
    else score += Math.max(0, 15 - (job.minYears - years) * 6);

    // Area match - 10 pts
    if(area === "Any" || job.area === "Any" || job.area === area) score += 10;
    else score += 2;

    // Employment type - 5 pts
    if(hours === "Any" || job.type === hours) score += 5;

    // Work mode - 5 pts
    if(mode === "Any" || job.mode === mode) score += 5;

    return { job, score: Math.round(score), skillMatchRatio, titleMatchRatio };
  });

  // Drop jobs that have essentially nothing to do with what the person asked
  // for, instead of just ranking everything (incl. irrelevant jobs) by score.
  const gaveSkills = skills.length > 0;
  const gaveTitle = !!desiredTitle;
  if(gaveSkills || gaveTitle){
    results = results.filter(r => r.skillMatchRatio > 0 || r.titleMatchRatio > 0.3);
  }

  return results
    .map(r => ({ job: r.job, score: Math.max(4, Math.min(99, r.score)) }))
    .sort((a,b)=> b.score - a.score);
}

function finishChat(){
  showStepTyping(()=>{
    lastResults = scoreJobs();
    renderResultsInChat();
  }, 600);
}

const RESULTS_INTROS = [
  n => `Here's what I found — these are your ${n} best matches!`,
  n => `Nice — I dug through the boards and found ${n} jobs worth a look.`,
  n => `Done! Here are the ${n} openings that fit best.`,
];
const RESULTS_EMPTY = [
  "I couldn't find any live listings that genuinely match what you're after right now — try loosening a preference, or check back after the boards refresh.",
  "Nothing matched closely enough this time. Try widening one of your answers, or check back once the boards refresh.",
];

function renderResultsInChat(){
  const items = lastResults;
  const summary = items.length ? pick(RESULTS_INTROS)(items.length) : pick(RESULTS_EMPTY);

  const bodyHtml = (items.length ? `<div class="cards-grid" id="chat-results-grid"></div>` : '')
    + `<div class="chat-input-row"><button type="button" class="btn btn-ghost" id="chat-restart">Start over <span class="msym">refresh</span></button></div>`;

  const step = renderStep(`<div class="msg-bubble">${summary}</div>`, bodyHtml);
  step.style.minHeight = '0';

  if(items.length){
    renderCards(step.querySelector('#chat-results-grid'), items);
  }
  step.querySelector('#chat-restart').addEventListener('click', restartChat);
  pageFooter.classList.add('show');
}

function renderCards(grid, items){
  items.forEach((r, i)=>{
    const card = document.createElement('div');
    const color = CARD_COLORS_LIST[i % CARD_COLORS_LIST.length];
    card.className = `job-card ${color}`;
    card.style.animationDelay = (i*0.06)+'s';

    const circumference = 2 * Math.PI * 24;
    const offset = circumference - (r.score/100) * circumference;

    card.innerHTML = `
      <div class="top-row">
        <span class="source-tag">${r.job.site}</span>
        <div class="match-ring">
          <svg viewBox="0 0 56 56">
            <circle class="bg" cx="28" cy="28" r="24"></circle>
            <circle class="fg" cx="28" cy="28" r="24" stroke-dasharray="${circumference}" stroke-dashoffset="${circumference}"></circle>
          </svg>
          <div class="val">${r.score}%</div>
        </div>
      </div>
      <h4>${r.job.title}</h4>
      <div class="company">${r.job.logoUrl ? `<img src="${r.job.logoUrl}" alt="" style="width:16px;height:16px;object-fit:contain;border-radius:3px" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'msym',textContent:'storefront',style:'font-size:16px'}))">` : `<span class="msym" style="font-size:16px">storefront</span>`} ${r.job.company || 'Employer not listed — check posting'}</div>
      <div class="meta-row">
        <div class="meta-pill"><span class="msym">location_on</span> ${r.job.area}</div>
        <div class="meta-pill"><span class="msym">schedule</span> ${r.job.type}</div>
        <div class="meta-pill"><span class="msym">home_work</span> ${r.job.mode}</div>
      </div>
      <div class="skill-line"><b>Key skills</b>${r.job.skills.join(', ')}</div>
      <button class="apply-btn" data-url="${r.job.url}" data-title="${r.job.title}">
        <div class="fill-anim"></div>
        <span class="msym">rocket_launch</span>
        <span>Apply on ${r.job.site}</span>
      </button>
    `;
    grid.appendChild(card);

    requestAnimationFrame(()=>{
      const fg = card.querySelector('.match-ring .fg');
      setTimeout(()=>{ fg.style.strokeDashoffset = offset; }, 80 + i*40);
    });

    card.querySelector('.apply-btn').addEventListener('click', function(){
      launchApply(this);
    });
  });
}

function restartChat(){
  chatAnswers.skills = []; chatAnswers.years = 2; chatAnswers.title = '';
  chatAnswers.area = 'Any'; chatAnswers.hours = 'Any'; chatAnswers.mode = 'Any';
  chatIndex = 0;
  isRestart = true;
  askStep(0);
}

function startChat(){
  initJobs(); // scrape runs quietly in the background, no loading message shown
  askStep(0);
}

function beginExperience(){
  const welcome = document.getElementById('welcome-screen');
  const chatSection = document.getElementById('chat-section');
  welcome.classList.add('hide');
  chatSection.classList.add('show');
  setTimeout(()=>{ welcome.style.display = 'none'; }, 500);
  startChat();
}

document.getElementById('welcome-start').addEventListener('click', beginExperience);
document.querySelectorAll('.welcome-hint').forEach(hint=>{
  hint.addEventListener('click', beginExperience);
});

/* ---------------- GAMIFIED APPLY FLOW ---------------- */
function launchApply(btn){
  if(btn.classList.contains('launching')) return;
  btn.classList.add('launching');
  const originalHTML = btn.innerHTML;
  btn.innerHTML = `<div class="fill-anim" style="width:100%"></div><span class="msym">bolt</span><span>Launching portal...</span>`;

  burstConfetti(btn);

  const url = btn.dataset.url;
  const title = btn.dataset.title;

  setTimeout(()=>{
    window.open(url, '_blank');
    showToast(`Opening ${new URL(url).hostname.replace('www.','')} for "${title}"`);
    btn.innerHTML = `<span class="msym">check_circle</span><span>Portal opened</span>`;
    setTimeout(()=>{
      btn.classList.remove('launching');
      btn.innerHTML = originalHTML;
    }, 1800);
  }, 750);
}

function burstConfetti(el){
  const rect = el.getBoundingClientRect();
  const colors = ['#3FB6AE','#FF9E80','#8E6FD1','#F16A88','#4CAF7D'];
  for(let i=0;i<26;i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = (rect.left + rect.width/2 + (Math.random()*160-80)) + 'px';
    piece.style.top = (rect.top - 10) + 'px';
    piece.style.background = colors[Math.floor(Math.random()*colors.length)];
    piece.style.animationDelay = (Math.random()*0.15)+'s';
    piece.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(piece);
    setTimeout(()=> piece.remove(), 1300);
  }
}

function showToast(msg){
  const toast = document.getElementById('toast');
  document.getElementById('toast-text').textContent = msg;
  toast.classList.add('show');
  setTimeout(()=> toast.classList.remove('show'), 3200);
}
