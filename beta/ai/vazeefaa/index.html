<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vazeefaa AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800;900&family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0..1,0" />
<style>
  :root{
    --ink:#FFFFFF;
    --ink-soft:#B8B5C0;
    --paper:#1A1A1E;
    --cloud:#0D0D10;
    --line:#2C2A34;

    --lagoon:#4FD1C5;
    --lagoon-deep:#2C948D;
    --coral:#FF9E80;

    --indigo:#6A4AE0;
    --indigo-deep:#4F2DB8;

    --glass-border:rgba(255,255,255,0.08);
    --glass-shadow:0 8px 32px rgba(0,0,0,0.6);

    --mint:#1A4733;
    --mint-ink:#A1F0D0;
    --sky:#1A314A;
    --sky-ink:#8FCBFF;
    --peach:#4A2F1F;
    --peach-ink:#FFC9A0;
    --lav:#2E2349;
    --lav-ink:#C9B0FF;
    --blush:#47262E;
    --blush-ink:#FFA5B5;

    --shadow-sm: 0 2px 12px rgba(0,0,0,0.5);
    --shadow-md: 0 10px 30px rgba(0,0,0,0.7);
    --shadow-lg: 0 20px 60px rgba(0,0,0,0.8);
    --radius: 26px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cloud);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
    font-weight:600;
  }
  .msym{
    font-family:'Material Symbols Outlined';
    font-weight:400;
    font-style:normal;
    font-size:24px;
    line-height:1;
    display:inline-block;
    vertical-align:middle;
    -webkit-font-smoothing:antialiased;
    white-space:nowrap;
    word-wrap:normal;
    direction:ltr;
    letter-spacing:normal;
    text-transform:none;
    font-feature-settings:'liga';
    -webkit-font-feature-settings:'liga';
    -moz-font-feature-settings:'liga';
    font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
  }
  h1,h2,h3,.display{
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    letter-spacing:0.2px;
  }
  a{color:inherit;}
  button{font-family:inherit;}

  .ambient{
    position:fixed; inset:0; z-index:-1; overflow:hidden; pointer-events:none;
    background:#0D0D10;
  }
  .mesh-bg{
    position:absolute; inset:-15%;
  }
  .blob{
    position:absolute; border-radius:50%; filter:blur(min(11vw,95px));
    mix-blend-mode:screen;
    will-change:transform; transform:translate(-50%,-50%);
    opacity:0.7;
  }
  .blob-1{ width:72vw; height:72vw; left:74%; top:6%;  background:radial-gradient(circle, rgba(255,140,90,0.25)  0%, rgba(255,140,90,0) 70%); }
  .blob-2{ width:66vw; height:66vw; left:92%; top:44%; background:radial-gradient(circle, rgba(255,110,175,0.22) 0%, rgba(255,110,175,0) 70%); }
  .blob-3{ width:74vw; height:74vw; left:58%; top:88%; background:radial-gradient(circle, rgba(110,220,155,0.22) 0%, rgba(110,220,155,0) 70%); }
  .blob-4{ width:68vw; height:68vw; left:10%; top:90%; background:radial-gradient(circle, rgba(90,210,200,0.22)  0%, rgba(90,210,200,0)  70%); }
  .blob-5{ width:64vw; height:64vw; left:0%;  top:42%; background:radial-gradient(circle, rgba(175,140,255,0.22) 0%, rgba(175,140,255,0) 70%); }
  .blob-6{ width:62vw; height:62vw; left:16%; top:2%;  background:radial-gradient(circle, rgba(110,210,255,0.22)  0%, rgba(110,210,255,0)  70%); }
  .blob-7{ width:58vw; height:58vw; left:46%; top:42%; background:radial-gradient(circle, rgba(255,224,110,0.18) 0%, rgba(255,224,110,0)  70%); }
  .blob-8{ width:60vw; height:60vw; left:62%; top:22%; background:radial-gradient(circle, rgba(255,130,150,0.18) 0%, rgba(255,130,150,0)  70%); }

  section{ position:relative; z-index:2; padding:10px 6vw 70px; }
  .section-head{ text-align:center; max-width:640px; margin:0 auto 34px; }
  .section-head h2{ font-size:clamp(1.6rem,2.6vw,2.1rem); margin:0 0 10px; }
  .section-head p{ color:var(--ink-soft); font-size:0.98rem; margin:0; }

  #chat-section{ display:block; }
  .chat-shell{ max-width:720px; margin:0 auto; padding:0 6vw; }
  @media(min-width:600px){ .chat-shell{ padding:0 20px; } }
  .chat-window{ display:flex; flex-direction:column; }

  .chat-step{
    min-height:100vh; min-height:100dvh;
    display:flex; flex-direction:column;
    padding:34px 0 150px;
    box-sizing:border-box;
    animation:stepIn .45s cubic-bezier(.22,1,.36,1);
  }
  .step-header .msg-bubble + .msg-bubble{ margin-top:20px; }
  .msg-bubble.typing-caret::after{
    content:''; display:inline-block; width:3px; height:1em; margin-left:3px;
    background:currentColor; vertical-align:-0.15em; animation:caretBlink 0.85s steps(1) infinite;
  }
  @keyframes caretBlink{ 0%,55%{ opacity:1; } 56%,100%{ opacity:0; } }
  .step-body{ flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:16px; padding-top:40px; }
  .step-options{ display:flex; flex-wrap:wrap; gap:10px; }

  .chat-bar{
    display:none; position:fixed; left:0; right:0; bottom:0; z-index:40;
    padding:14px 6vw calc(14px + env(safe-area-inset-bottom));
    background:rgba(13,13,16,0.85);
    border-top:1px solid rgba(255,255,255,0.06);
  }
  @media(min-width:600px){ .chat-bar{ padding-left:20px; padding-right:20px; } }
  .chat-bar-inner{ max-width:720px; margin:0 auto; display:flex; gap:10px; align-items:center; }
  .chat-bar-inner .chip-input, .chat-bar-inner input[type=text]{ flex:1; margin:0; }
  .chat-bar-submit{
    width:52px; height:52px; border-radius:50%; border:none; flex-shrink:0;
    background:#FFFFFF; color:#0D0D10; display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:0 4px 16px rgba(255,255,255,0.2); transition:transform .2s, background .2s;
  }
  .chat-bar-submit:hover{ background:#E8E8E8; transform:translateY(-2px); }
  .chat-bar-submit .msym{ font-size:24px; }

  .msg{ display:flex; gap:12px; max-width:100%; animation:msgIn .45s cubic-bezier(.22,1,.36,1); }
  @keyframes msgIn{ from{ opacity:0; transform:translateY(14px) scale(0.98);} to{ opacity:1; transform:translateY(0) scale(1);} }
  .msg.user{ flex-direction:row-reverse; }
  .msg-avatar{ display:none; }
  .msg.user .msg-avatar{
    display:flex; width:34px; height:34px; border-radius:50%; flex-shrink:0;
    align-items:center; justify-content:center;
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:0.85rem; color:#0D0D10;
    background:var(--ink);
  }
  .msg-col{ display:flex; flex-direction:column; gap:10px; max-width:88%; }
  .msg.user .msg-col{ align-items:flex-end; max-width:82%; }
  .msg-bubble{
    background:transparent; color:var(--ink);
    border-radius:0; padding:0; line-height:1.5; font-size:1.2rem; font-weight:700;
    box-shadow:none;
  }
  .msg.user .msg-bubble{ background:var(--ink); color:#0D0D10; border-radius:18px 18px 4px 18px; padding:13px 17px; font-size:0.95rem; font-weight:700; box-shadow:none; }

  .typing-dots{ display:flex; gap:4px; padding:16px 18px; }
  .typing-dots span{ width:6px; height:6px; border-radius:50%; background:var(--ink-soft); animation:blinkDot 1.2s infinite; }
  .typing-dots span:nth-child(2){ animation-delay:.2s; }
  .typing-dots span:nth-child(3){ animation-delay:.4s; }
  @keyframes blinkDot{ 0%,80%,100%{ opacity:.25; } 40%{ opacity:1; } }

  .option-row{ display:flex; flex-wrap:wrap; gap:10px; }
  .option-btn{
    display:inline-flex; align-items:center; gap:8px;
    border:1.5px solid rgba(255,255,255,0.15); background:rgba(255,255,255,0.06); color:var(--ink);
    border-radius:999px; padding:12px 20px; font-weight:700; font-size:0.9rem;
    cursor:pointer; transition:all .25s cubic-bezier(.22,1,.36,1); font-family:inherit;
    animation:msgIn .4s cubic-bezier(.22,1,.36,1) backwards;
  }
  .option-btn .msym{ font-size:17px; color:var(--ink-soft); transition:color .25s; }
  .option-btn:hover:not(:disabled){ border-color:#FFFFFF; color:#fff; transform:translateY(-2px) scale(1.02); box-shadow:var(--shadow-sm); background:rgba(255,255,255,0.12); }
  .option-btn.picked{ background:#FFFFFF; border-color:#FFFFFF; color:#0D0D10; }
  .option-btn.picked .msym{ color:#0D0D10; }
  .option-btn:disabled{ cursor:default; opacity:0.5; }
  .option-btn:disabled:not(.picked){ display:none; }

  .bento-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
  .bento-card{
    display:flex; flex-direction:column; align-items:flex-start; justify-content:flex-end; gap:12px;
    border:1.5px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.05); color:var(--ink);
    border-radius:26px; padding:24px; min-height:130px; text-align:left;
    font-weight:800; font-size:1.05rem; line-height:1.3; font-family:inherit;
    cursor:pointer; transition:all .25s cubic-bezier(.22,1,.36,1);
    animation:msgIn .4s cubic-bezier(.22,1,.36,1) backwards;
    box-shadow:var(--shadow-sm);
  }
  .bento-card .msym{ font-size:32px; color:#FFFFFF; transition:color .25s; }
  .bento-card:hover:not(:disabled){ transform:translateY(-4px) scale(1.015); box-shadow:var(--shadow-md); border-color:#FFFFFF; background:rgba(255,255,255,0.1); }
  .bento-card.picked{ background:#FFFFFF; border-color:#FFFFFF; color:#0D0D10; box-shadow:0 14px 30px rgba(255,255,255,0.2); }
  .bento-card.picked .msym{ color:#0D0D10; }
  .bento-card:disabled{ cursor:default; opacity:0.5; }
  .bento-card:disabled:not(.picked){ display:none; }
  .bento-card.wide{ grid-column:span 2; flex-direction:row; align-items:center; justify-content:flex-start; min-height:88px; }

  .chat-input-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .chat-input-row input{ flex:1; }

  .game-step{ display:flex; flex-direction:column; gap:16px; padding-bottom:50px; }
  .game-topbar{ display:flex; align-items:center; gap:14px; }
  .game-icon-btn{
    width:44px; height:44px; border-radius:50%; flex-shrink:0; cursor:pointer;
    border:1.5px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.05);
    display:flex; align-items:center; justify-content:center; color:var(--ink);
    transition:all .2s;
  }
  .game-icon-btn:hover:not(:disabled){ border-color:#FFFFFF; color:#fff; transform:translateY(-2px); box-shadow:var(--shadow-sm); background:rgba(255,255,255,0.1); }
  .game-icon-btn:disabled{ opacity:0.35; cursor:default; }
  .game-progress{ flex:1; display:flex; flex-direction:column; gap:6px; }
  .game-progress-track{ height:6px; border-radius:999px; background:rgba(255,255,255,0.1); overflow:hidden; }
  .game-progress-fill{ height:100%; background:#FFFFFF; border-radius:999px; transition:width .4s ease; }
  .game-progress-label{ font-size:0.72rem; font-weight:700; color:var(--ink-soft); text-align:center; }
  .game-hint{ text-align:center; font-size:0.78rem; color:var(--ink-soft); }

  .swipe-stack{ position:relative; flex:1; min-height:430px; touch-action:none; }
  .swipe-card{
    position:absolute; inset:0 0 auto 0; width:100%; max-width:420px; margin:0 auto;
    transform:translateY(calc(var(--depth,0) * 12px)) scale(calc(1 - var(--depth,0) * 0.05));
    opacity:calc(1 - var(--depth,0) * 0.3);
    z-index:calc(10 - var(--depth,0));
    transition:transform .35s cubic-bezier(.22,1,.36,1), opacity .35s;
    cursor:grab; user-select:none;
  }
  .swipe-card:not([data-depth="0"]){ pointer-events:none; }
  .swipe-card.dragging{ transition:none; cursor:grabbing; }
  .swipe-card.entering{ animation:cardPeekIn .35s cubic-bezier(.22,1,.36,1); }
  @keyframes cardPeekIn{ from{ opacity:0; transform:translateY(16px) scale(0.97);} }
  .swipe-stamp{
    position:absolute; top:22px; z-index:5; padding:7px 16px; border:3px solid; border-radius:10px;
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:1.15rem; letter-spacing:1.5px;
    opacity:0; pointer-events:none; text-transform:uppercase; background:rgba(0,0,0,0.6);
  }
  .swipe-stamp.like{ left:20px; color:#4FD1C5; border-color:#4FD1C5; transform:rotate(-12deg); }
  .swipe-stamp.pass{ right:20px; color:#FF7A8A; border-color:#FF7A8A; transform:rotate(12deg); }

  .game-actions{ display:flex; justify-content:center; gap:26px; }
  .swipe-action-btn{
    width:62px; height:62px; border-radius:50%; cursor:pointer; background:#1A1A1E;
    display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-md);
    transition:transform .15s; flex-shrink:0; border:1px solid rgba(255,255,255,0.1);
  }
  .swipe-action-btn:active{ transform:scale(0.9); }
  .swipe-action-btn.pass{ color:#FF7A8A; border-color:#4A2630; }
  .swipe-action-btn.like{ color:#4FD1C5; border-color:#1A3D36; }
  .swipe-action-btn .msym{ font-size:28px; }

  .chip-input{
    display:flex; flex-wrap:wrap; gap:8px; align-items:center;
    border:1.5px solid rgba(255,255,255,0.12); border-radius:999px; padding:12px 18px; min-height:56px;
    transition:border-color .2s; background:rgba(255,255,255,0.05);
  }
  .chip-input:focus-within{ border-color:#FFFFFF; background:rgba(255,255,255,0.08); }
  .chip-input input{
    border:none; outline:none; flex:1; min-width:140px; font-size:0.98rem; padding:6px; font-family:inherit;
    background:transparent; color:var(--ink); font-weight:600;
  }
  .chip-input input::placeholder{ color:#6A657A; }
  .chip{
    background:var(--mint); color:var(--mint-ink); font-weight:800; font-size:0.82rem;
    padding:7px 8px 7px 12px; border-radius:999px; display:flex; align-items:center; gap:6px;
    animation:popIn .3s cubic-bezier(.22,1,.36,1);
  }
  @keyframes popIn{ from{ transform:scale(0.6); opacity:0;} to{ transform:scale(1); opacity:1;} }
  .chip .x{ cursor:pointer; font-size:16px; opacity:0.7; }
  .chip .x:hover{ opacity:1; }

  input[type=text], input[type=number]{
    border:1.5px solid rgba(255,255,255,0.12); border-radius:999px; padding:13px 18px;
    font-size:0.95rem; font-family:inherit; color:var(--ink); background:rgba(255,255,255,0.05); outline:none;
    transition:border-color .2s; font-weight:600;
  }
  input:focus{ border-color:#FFFFFF; background:rgba(255,255,255,0.08); }

  .btn{
    border:none; border-radius:999px; padding:13px 24px; font-weight:800; font-size:0.95rem;
    cursor:pointer; display:inline-flex; align-items:center; gap:8px; transition:all .25s cubic-bezier(.22,1,.36,1);
  }

  .btn-primary{ background:var(--ink); color:#0D0D10; }
  .btn-primary:hover{ transform:translateY(-2px); box-shadow:var(--shadow-md); }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1px solid rgba(255,255,255,0.08); }
  .btn-ghost:hover{ color:#fff; border-color:rgba(255,255,255,0.25); background:rgba(255,255,255,0.05); }
  .btn-lagoon{ background:#FFFFFF; color:#0D0D10; padding:15px 30px; font-size:1rem; box-shadow:0 10px 26px rgba(255,255,255,0.15); }
  .btn-lagoon:hover{ background:#E8E8E8; transform:translateY(-2px); box-shadow:0 12px 28px rgba(255,255,255,0.2); }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; transform:none !important; box-shadow:none !important; }

  @keyframes stepIn{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }

  .cards-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
    gap:20px; margin-top:4px;
  }
  .job-card{
    border-radius:26px; padding:24px; position:relative; overflow:hidden;
    box-shadow:var(--glass-shadow); transition:transform .25s, box-shadow .25s, background .25s;
    animation:cardIn .5s ease both;
    background:rgba(20,20,26,0.7);
    border:1px solid var(--glass-border);
    color:var(--ink);
  }
  .job-card::before{
    content:''; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
    background:linear-gradient(160deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0) 40%);
  }
  .job-card:hover{ transform:translateY(-6px); box-shadow:0 16px 44px rgba(0,0,0,0.7); background:rgba(30,30,38,0.85); }
  @keyframes cardIn{ from{ opacity:0; transform:translateY(18px) scale(0.98);} to{ opacity:1; transform:translateY(0) scale(1);} }

  .job-card .top-row{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; position:relative; z-index:1; }
  .job-card .source-tag{
    font-size:0.68rem; font-weight:800; letter-spacing:0.4px; text-transform:uppercase;
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.08);
    padding:5px 12px; border-radius:999px; color:var(--ink-soft);
  }
  .match-ring{ position:relative; width:56px; height:56px; flex-shrink:0; }
  .match-ring svg{ transform:rotate(-90deg); width:56px; height:56px; }
  .match-ring circle{ fill:none; stroke-width:5; }
  .match-ring .bg{ stroke:rgba(255,255,255,0.1); }
  .match-ring .fg{ stroke:#FFFFFF; stroke-linecap:round; transition:stroke-dashoffset 1s cubic-bezier(.65,0,.35,1); }
  .match-ring .val{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:0.8rem; color:var(--ink);
  }

  .job-card h4{ margin:0 0 6px; font-size:1.3rem; font-family:'Baloo 2',sans-serif; font-weight:800; position:relative; z-index:1; color:#fff; }
  .job-card .company{ font-weight:700; font-size:0.95rem; margin-bottom:12px; opacity:0.8; display:flex; align-items:center; gap:6px; position:relative; z-index:1; color:var(--ink-soft); }
  .job-card .meta-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; position:relative; z-index:1; }
  .meta-pill{
    background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.06);
    padding:6px 12px; border-radius:999px;
    font-size:0.75rem; font-weight:700; display:flex; align-items:center; gap:5px; color:var(--ink-soft);
  }
  .meta-pill .msym{ font-size:15px; }

  .job-card .skill-line{ font-size:0.8rem; opacity:0.8; margin-bottom:18px; line-height:1.5; position:relative; z-index:1; color:var(--ink-soft); }
  .job-card .skill-line b{ display:block; font-size:0.68rem; text-transform:uppercase; letter-spacing:0.4px; margin-bottom:4px; opacity:0.6; color:var(--ink-soft); }

  .apply-btn{
    width:100%; border:none; border-radius:14px; padding:14px; font-weight:800; font-size:0.95rem;
    background:#FFFFFF; color:#0D0D10; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
    position:relative; overflow:hidden; transition:transform .15s; z-index:1;
  }
  .apply-btn:active{ transform:scale(0.97); }
  .apply-btn .fill-anim{
    position:absolute; left:0; top:0; bottom:0; width:0%; background:#6A4AE0; z-index:0; transition:width .7s cubic-bezier(.5,0,.2,1);
  }
  .apply-btn span, .apply-btn .msym{ position:relative; z-index:1; }
  .apply-btn.launching .fill-anim{ width:100%; }

  /* Plain color cards (no gradient) */
  .job-card.c-mint{ background:#1A4733; border-color:rgba(161,240,208,0.15); }
  .job-card.c-mint .source-tag{ color:var(--mint-ink); border-color:rgba(161,240,208,0.2); }
  .job-card.c-sky{ background:#1A314A; border-color:rgba(143,203,255,0.15); }
  .job-card.c-sky .source-tag{ color:var(--sky-ink); border-color:rgba(143,203,255,0.2); }
  .job-card.c-peach{ background:#4A2F1F; border-color:rgba(255,201,160,0.15); }
  .job-card.c-peach .source-tag{ color:var(--peach-ink); border-color:rgba(255,201,160,0.2); }
  .job-card.c-lav{ background:#2E2349; border-color:rgba(201,176,255,0.15); }
  .job-card.c-lav .source-tag{ color:var(--lav-ink); border-color:rgba(201,176,255,0.2); }
  .job-card.c-blush{ background:#47262E; border-color:rgba(255,165,181,0.15); }
  .job-card.c-blush .source-tag{ color:var(--blush-ink); border-color:rgba(255,165,181,0.2); }
  .job-card .match-ring .fg{ stroke:#FFFFFF; }

  /* All job icons white */
  .job-card .job-icon{

function extractKeywords(text){
  const lower = (text || "").toLowerCase();
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  return ALL_KEYWORDS.filter(kw => new RegExp(`\\b${esc(kw)}\\b`).test(lower));
}

function scoreCareersFromKeywords(matchedKeywords){
  const scores = {};
  Object.entries(CAREER_KEYWORDS).forEach(([career, kwMap])=>{
    let score = 0;
    matchedKeywords.forEach(kw=>{ if(kwMap[kw]) score += kwMap[kw]; });
    if(score > 0) scores[career] = score;
  });
  return Object.entries(scores).sort((a,b)=> b[1]-a[1]).map(([career])=>career);
}

const CATEGORY_PRIORITY = [

  'music','marketing','fitness','business','hospitality',

function detectCategory(matchedKeywords){
  const set = new Set(matchedKeywords);
  for(const key of CATEGORY_PRIORITY){
    if(CATEGORY_FOLLOWUPS[key].trigger.some(t => set.has(t))) return key;
  }
  return null;
}

/* Walks the detected category's 1-2 follow-up questions, one full-page
   step at a time (reusing the same bento-card step UI as the rest of the
   chat), and returns the bonus keywords tied to whatever was picked. */
async function askCategoryFollowups(categoryKey){
  const cat = CATEGORY_FOLLOWUPS[categoryKey];
  if(!cat) return [];
  const bonus = [];
  for(let q=0; q<cat.questions.length; q++){
    const question = cat.questions[q];
    await new Promise(res => showStepTyping(res, q===0 ? 160 : 260));
    const step = await renderStep([question.text], `<div class="bento-grid">${bentoCardsHtml(question.options)}</div>`);
    const picked = await new Promise(resolve=>{
      step.querySelectorAll('.bento-card').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          step.querySelectorAll('.bento-card').forEach(b=>b.disabled = true);
          btn.classList.add('picked');
          const opt = question.options.find(o => o.value === btn.dataset.val);
          setTimeout(()=> resolve(opt), 260);
        });
      });
    });
    if(picked){
      chatAnswers.categoryAnswers = chatAnswers.categoryAnswers || {};
      chatAnswers.categoryAnswers[categoryKey + '_' + q] = picked.value;
      bonus.push(...(picked.bonus || []));
    }
  }
  return bonus;
}

function guessArea(text){
  const found = AREA_LIST.find(a => text.toLowerCase().includes(a.toLowerCase()));
  return found || "Any";
}
function guessPosted(text){
  const m = text.match(/(\d+)\s*(hour|day|week|month)s?\s*ago/i);
  return m ? m[0] : "Recently";
}
const COMPANY_SUFFIXES = /(Pvt\.?\s?Ltd|LLC|LLP|Ltd|Resort(?:\s*&\s*Spa)?|Hotel|Guesthouse|Group|Trading|Enterprises|Company|Co\.|Inc|Maldives|School|Hospital|Clinic)/i;
function guessCompany(text, title){
  const idx = text.indexOf(title);
  const searchText = idx !== -1 ? (text.slice(0, idx) + ' ' + text.slice(idx + title.length)) : text;
  const looksLikeMarkdownOrUrl = s => /[\[\]()]/.test(s) || /https?:|www\.|\.[a-z]{2,4}\//i.test(s);

  const suffixMatch = searchText.match(new RegExp(`([A-Z][A-Za-z&'.,\\- ]{2,55}${COMPANY_SUFFIXES.source})`));
  if(suffixMatch && !looksLikeMarkdownOrUrl(suffixMatch[1])) return suffixMatch[1].trim();

  if(idx !== -1){
    const after = text.slice(idx + title.length, idx + title.length + 80);
    const candidate = after.split(/[•·|\-]/)[0].replace(/^[\s,]+/, '').trim();
    const looksLikeNoise = /^\d|ago$|^(full|part)[\s-]?time$|remote|hybrid|onsite/i.test(candidate);
    if(candidate.length > 2 && candidate.length < 60 && !looksLikeNoise && !looksLikeMarkdownOrUrl(candidate) && !AREA_LIST.some(a=>candidate.toLowerCase()===a.toLowerCase())){
      return candidate;
    }
  }
  return null;
}
function guessType(text){
  if(/part[\s-]?time/i.test(text)) return "Part-time";
  if(/intern/i.test(text)) return "Intern";
  if(/freelance/i.test(text)) return "Freelance";
  return "Full-time";
}
function guessMode(text){
  if(/remote/i.test(text)) return "Remote";
  if(/hybrid/i.test(text)) return "Hybrid";
  return "Onsite";
}
function guessSkills(title){
  const t = title.toLowerCase();
  const tags = new Set();
  for(const [kw, sk] of Object.entries(SKILL_KEYWORDS)){
    if(t.includes(kw)) sk.forEach(s=>tags.add(s));
  }
  return [...tags];
}

async function fetchViaProxy(url){
  const attemptErrors = [];

  const attempt = (proxy) => (async () => {
    try{
      const res = await fetch(proxy.build(url), { signal: AbortSignal.timeout(15000) });
      if(!res.ok){
        const e = new Error(`${proxy.name}: HTTP ${res.status}`);
        console.warn(`[${proxy.name}] HTTP ${res.status} for`, url);
        throw e;
      }
      const text = await res.text();
      if(!text || text.length < 200){
        const e = new Error(`${proxy.name}: empty/short response`);
        console.warn(`[${proxy.name}] empty/short response for`, url);
        throw e;
      }
      return { content: text, mode: proxy.mode, via: proxy.name };
    }catch(err){
      const msg = (err && err.message) || `${proxy.name}: network error`;
      attemptErrors.push(msg);
      console.warn(`[${proxy.name}] failed for`, url, err);
      throw err;
    }
  })();

  try{
    return await Promise.any(CORS_PROXIES.map(attempt));
  }catch(aggregateErr){
    throw new Error(attemptErrors.join('; ') || 'all proxies failed');
  }
}

function absUrl(u, base){
  if(!u) return null;
  try{ return new URL(u, base).href; } catch(e){ return null; }
}

function extractJobsFromHTML(html, source){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  if(source.site === 'Jobsicle') return parseJobsicleHTML(doc, source);
  if(source.site === 'Job Center Maldives') return parseJobCenterHTML(doc, source);
  if(source.site === 'Job Maldives') return parseJobMaldivesHTML(doc, source);
  return parseGenericHTML(doc, source);
}

// ---- Jobsicle: rows are <button id="job-row-{i}-{jobId}">, job title and
// company both live in <span>s inside the button; company span carries
// class "font-medium text-neutral-700". There's no plain <a href> on the
// row in the static HTML, so the detail URL is reconstructed from the
// numeric id in the button's id attribute — this is a best-effort guess
// (falls back to the listing page itself if nothing better is found).
// Generic call-to-action link text (e.g. a separate "Apply Now" button
// pointing at the same job URL as the real title link) that should never
// be mistaken for the job title itself.
const CTA_LABEL_RE = /^(apply(\s*now)?|apply here|view( job| details| more)?|read more|learn more|see (more|job|details)|more info|(job|full) details|details)$/i;

// Given a list of {href, label, ...} candidates (possibly several per href,
// e.g. a title link plus a separate "Apply Now" button to the same job),
// keep one winner per href: prefer a real-looking label over a CTA one,
// and the more descriptive label when both look real. Drops any href where
// every candidate label was just a CTA phrase.
function pickBestPerHref(candidates){
  const byHref = new Map();
  candidates.forEach(c=>{
    if(!c.href || !c.label || c.label.length < 3) return;
    const isCTA = CTA_LABEL_RE.test(c.label);
    const existing = byHref.get(c.href);
    if(!existing) byHref.set(c.href, { ...c, isCTA });
    else if(existing.isCTA && !isCTA) byHref.set(c.href, { ...c, isCTA });
    else if(!existing.isCTA && !isCTA && c.label.length > existing.label.length) byHref.set(c.href, { ...c, isCTA });
  });
  return [...byHref.values()].filter(v => !v.isCTA);
}

function parseJobsicleHTML(doc, source){
  const jobs = [];
  const seen = new Set();

  doc.querySelectorAll('button[id^="job-row-"]').forEach(btn=>{
    const spans = [...btn.querySelectorAll('span')];
    if(spans.length === 0) return;

    const companySpan = spans.find(s => /font-medium/.test(s.className) && /text-neutral-700/.test(s.className));
    const company = companySpan ? companySpan.textContent.replace(/\s+/g,' ').trim() : null;

    const titleSpan = spans.find(s => s !== companySpan && s.textContent.trim().length > 2);
    const title = titleSpan ? titleSpan.textContent.replace(/\s+/g,' ').trim() : null;
    if(!title) return;

    let href = null;
    const linkEl = btn.querySelector('a[href]') || btn.closest('a[href]');
    if(linkEl) href = absUrl(linkEl.getAttribute('href'), source.base);
    if(!href){
      const idMatch = btn.id.match(/(\d+)$/);
      if(idMatch) href = `${source.base}/job/${idMatch[1]}`;
    }
    if(!href || seen.has(href)) return;
    seen.add(href);

    const context = btn.textContent.replace(/\s+/g,' ').trim();
    jobs.push({
      id: href, title, company, logoUrl: null,
      area: guessArea(context), type: guessType(context), mode: guessMode(context),
      minYears: 0, skills: guessSkills(title),
      site: source.site, url: href, posted: guessPosted(context),
    });
  });

  return jobs.slice(0, 40);
}

// ---- Job Center Maldives: each job link is an <a href="/en/jobs/..."
// title="Job Title">, and inside it the company name and logo both sit in
// their own ".mb-2" blocks — one holds an <img class="img-fluid h-md">,
// the other holds the plain-text business name.
function parseJobCenterHTML(doc, source){
  const jobs = [];

  const candidates = [];
  doc.querySelectorAll('a[href]').forEach(a=>{
    let path;
    try{ path = new URL(a.getAttribute('href'), source.base).pathname; }
    catch(e){ return; }
    if(!source.linkPattern.test(path)) return;

    const href = absUrl(a.getAttribute('href'), source.base);
    if(!href) return;
    const label = (a.getAttribute('title') || a.textContent || '').replace(/\s+/g,' ').trim();
    if(label.length < 3) return;
    candidates.push({ href, label, el: a });
  });

  pickBestPerHref(candidates).forEach(({ href, label, el: a })=>{
    const title = label;

    let scope = a.querySelectorAll('.mb-2').length ? a : (a.closest('.mb-2') ? a.parentElement : a.parentElement);
    let mb2s = [...scope.querySelectorAll('.mb-2')];
    if(mb2s.length === 0 && a.parentElement) mb2s = [...a.parentElement.querySelectorAll('.mb-2')];

    let company = null, logoUrl = null;
    mb2s.forEach(el=>{
      const img = el.querySelector('img.img-fluid.h-md, img.h-md.img-fluid, img');
      if(img && !logoUrl) logoUrl = absUrl(img.getAttribute('src'), source.base);
      const txt = el.textContent.replace(/\s+/g,' ').trim();
      if(!company && txt && txt !== title && txt.length > 1 && txt.length < 80) company = txt;
    });

    const context = (a.closest('.mb-2') ? a.parentElement : a).textContent.replace(/\s+/g,' ').trim();
    jobs.push({
      id: href, title, company, logoUrl,
      area: guessArea(context), type: guessType(context), mode: guessMode(context),
      minYears: 0, skills: guessSkills(title),
      site: source.site, url: href, posted: guessPosted(context),
    });
  });

  return jobs.slice(0, 40);
}

// ---- Job Maldives: a Blogger-hosted site. Each posting is
// <h3 class="post-title"><a href="...2026/07/....html">Title</a></h3>,
// and the real skill/category tags sit in a sibling "post-labels" block
// within the same post container — much more reliable than guessing
// skills from the title text, so we use them as-is when present.
function parseJobMaldivesHTML(doc, source){
  const jobs = [];
  const seen = new Set();

  doc.querySelectorAll('.post-title a[href], h3.post-title a[href], h2.post-title a[href]').forEach(a=>{
    const href = absUrl(a.getAttribute('href'), source.base);
    if(!href) return;
    let path;
    try{ path = new URL(href).pathname; } catch(e){ return; }
    if(!source.linkPattern.test(path)) return;
    if(seen.has(href)) return;

    const title = a.textContent.replace(/\s+/g,' ').trim();
    if(title.length < 3) return;
    seen.add(href);

    const postScope = a.closest('.post, .post-outer, article, .hentry') || a.closest('div') || a.parentElement;
    const labelEls = postScope ? [...postScope.querySelectorAll('.post-labels a, .post-labels')] : [];
    const tags = [...new Set(
      labelEls.flatMap(el => el.matches('a') ? [el.textContent] : [...el.querySelectorAll('a')].map(l=>l.textContent))
        .map(t => t.replace(/\s+/g,' ').trim())
        .filter(Boolean)
    )];

    const contextScope = postScope ? postScope.cloneNode(true) : null;
    if(contextScope){
      contextScope.querySelectorAll('.post-labels').forEach(el => el.remove());
    }
    const context = (postScope ? postScope.textContent : title).replace(/\s+/g,' ').trim();
    const companyContext = (contextScope ? contextScope.textContent : title).replace(/\s+/g,' ').trim();
    jobs.push({
      id: href, title,
      company: guessCompany(companyContext, title),
      logoUrl: null,
      area: guessArea(context), type: guessType(context), mode: guessMode(context),
      minYears: 0,
      skills: tags.length ? tags : guessSkills(title),
      site: source.site, url: href, posted: guessPosted(context),
    });
  });

  return jobs.slice(0, 40);
}

// ---- Career Maldives: no confirmed DOM details yet, so this stays on the
// generic href + surrounding-text heuristic until we know its real markup.
function parseGenericHTML(doc, source){
  const jobs = [];

  const candidates = [];
  [...doc.querySelectorAll('a[href]')].forEach(a=>{
    let path;
    try{ path = new URL(a.getAttribute('href'), source.base).pathname; }
    catch(e){ return; }
    if(!source.linkPattern.test(path)) return;

    const label = a.textContent.replace(/\s+/g,' ').trim();
    if(label.length < 3) return;
    const href = absUrl(a.getAttribute('href'), source.base);
    if(!href) return;
    candidates.push({ href, label, el: a });
  });

  pickBestPerHref(candidates).forEach(({ href, label, el: a })=>{
    const title = label;

    let node = a, context = '';
    for(let i=0;i<4 && node.parentElement;i++){
      node = node.parentElement;
      context = node.textContent.replace(/\s+/g,' ').trim();
      if(context.length > title.length + 15) break;
    }

    jobs.push({
      id: href,
      title,
      company: guessCompany(context, title),
      logoUrl: null,
      area: guessArea(context),
      type: guessType(context),
      mode: guessMode(context),
      minYears: 0,
      skills: guessSkills(title),
      site: source.site,
      url: href,
      posted: guessPosted(context),
    });
  });

  return jobs.slice(0, 40);
}

// (CTA_LABEL_RE is shared — declared earlier alongside pickBestPerHref)

function cleanMarkdownContext(str){
  return str
    .replace(/\[([^\]\n]{1,160})\]\(https?:\/\/[^\s)]+\)/g, '$1')
    .replace(/\]\(https?:\/\/[^\s)]*\)?/g, '')
    .replace(/[\[\]]/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}

function extractJobsFromMarkdown(text, source){
  const linkRe = /\[([^\]\n]{1,160})\]\((https?:\/\/[^\s)]+)\)/g;
  const byHref = new Map();
  let m;
  while((m = linkRe.exec(text)) !== null){
    const [full, rawLabel, href] = m;
    let path;
    try{ path = new URL(href).pathname; } catch(e){ continue; }
    if(!source.linkPattern.test(path)) continue;

    const label = rawLabel.replace(/\s+/g,' ').trim();
    if(label.length < 3) continue;
    const isCTA = CTA_LABEL_RE.test(label);

    const existing = byHref.get(href);
    if(!existing){
      byHref.set(href, { label, isCTA, index: m.index, len: full.length });
    } else if(existing.isCTA && !isCTA){
      byHref.set(href, { label, isCTA, index: existing.index, len: full.length });
    } else if(!existing.isCTA && !isCTA && label.length > existing.label.length){
      byHref.set(href, { ...existing, label });
    }
  }

  const jobs = [];
  for(const [href, info] of byHref){
    if(info.isCTA) continue;
    const title = info.label;

    const start = Math.max(0, info.index - 20);
    const end = Math.min(text.length, info.index + info.len + 200);
    const context = cleanMarkdownContext(text.slice(start, end));

    jobs.push({
      id: href,
      title,
      company: guessCompany(context, title),
      logoUrl: null,
      area: guessArea(context),
      type: guessType(context),
      mode: guessMode(context),
      minYears: 0,
      skills: guessSkills(title),
      site: source.site,
      url: href,
      posted: guessPosted(context),
    });
  }
  return jobs.slice(0, 40);
}

async function scrapeSource(source, attempt = 1, overrideUrl = null){
  const targetUrl = overrideUrl || source.listUrl;
  try{
    const { content, mode, via } = await fetchViaProxy(targetUrl);
    const jobs = mode === 'text'
      ? extractJobsFromMarkdown(content, source)
      : extractJobsFromHTML(content, source);
    if(jobs.length === 0){
      return { site: source.site, jobs: [], error: `fetched via ${via} but no job links matched — markup may have changed` };
    }
    return { site: source.site, jobs, error: null };
  }catch(err){
    if(attempt < 2){
      await new Promise(r => setTimeout(r, 1200));
      return scrapeSource(source, attempt + 1, overrideUrl);
    }
    console.warn('Live scrape failed for', source.site, targetUrl, err);
    return { site: source.site, jobs: [], error: (err && err.message) || 'fetch failed' };
  }
}

async function scrapeAllJobs(){
  const perSource = await Promise.all(SOURCES.map(s => scrapeSource(s)));
  return {
    jobs: perSource.flatMap(r => r.jobs),
    statuses: perSource.map(r => ({ site: r.site, count: r.jobs.length, error: r.error })),
  };
}

];
let meshAnimId = null;
let meshStartTs = null;

function meshFrame(ts){
  if(meshStartTs === null) meshStartTs = ts;
  const t = (ts - meshStartTs) / 1000;
  blobEls.forEach((el, i)=>{
    const m = BLOB_MOTION[i % BLOB_MOTION.length];
    const tx = Math.sin(t*m.fx + m.ph) * m.ax;
    const ty = Math.cos(t*m.fy + m.ph*1.3) * m.ay;
    const rot = Math.sin(t*m.rf + m.ph) * m.rr;
    const scale = 1 + Math.sin(t*m.sf + m.ph) * m.sa;
    el.style.transform = `translate(calc(-50% + ${tx}vw), calc(-50% + ${ty}vh)) rotate(${rot}deg) scale(${scale})`;
  });
  meshAnimId = requestAnimationFrame(meshFrame);
}
function startMeshDrift(){
  if(meshAnimId !== null) return;
  meshStartTs = null;
  meshAnimId = requestAnimationFrame(meshFrame);
}
function stopMeshDrift(){
  if(meshAnimId !== null){ cancelAnimationFrame(meshAnimId); meshAnimId = null; }
}

function typeInto(el, text, isSkipped){
  return new Promise(resolve=>{
    if(isSkipped()){ el.textContent = text; resolve(); return; }
    el.classList.add('typing-caret');
    let i = 0;
    const step = ()=>{
      if(isSkipped()){ el.textContent = text; el.classList.remove('typing-caret'); resolve(); return; }
      i++;
      el.textContent = text.slice(0, i);
      if(i >= text.length){ el.classList.remove('typing-caret'); resolve(); return; }
      const ch = text[i-1];
      let delay = 5 + Math.random()*6;
      if(/[,;—]/.test(ch)) delay += 35;
      if(/[.!?]/.test(ch)) delay += 90;
      setTimeout(step, delay);
    };
    step();
  });
}

async function renderStep(headerTexts, bodyHTML, barHTML){
  pageFooter.classList.remove('show');
  const texts = Array.isArray(headerTexts) ? headerTexts : [headerTexts];
  const bubblesHTML = texts.map((_,i)=>`<div class="msg-bubble" id="type-bubble-${i}"></div>`).join('');
  chatWindow.innerHTML = `<div class="chat-step"><div class="step-header">${bubblesHTML}</div><div class="step-body" id="step-body-target"></div></div>`;
  chatBar.innerHTML = ''; chatBar.style.display = 'none';
  window.scrollTo(0,0);
  const step = chatWindow.querySelector('.chat-step');
  const bodyTarget = step.querySelector('#step-body-target');
  bodyTarget.style.opacity = '0';

  let skipped = false;
  const onTap = ()=>{ skipped = true; };
  step.addEventListener('click', onTap);

  startMeshDrift();

  if(!skipped) await wait(120);

  for(let i=0;i<texts.length;i++){
    const el = step.querySelector('#type-bubble-'+i);
    await typeInto(el, texts[i], ()=>skipped);
    if(!skipped) await wait(160);
  }
  step.removeEventListener('click', onTap);

  stopMeshDrift();

  if(!skipped) await wait(90);

  bodyTarget.innerHTML = bodyHTML || '';
  bodyTarget.style.transition = 'opacity .45s ease';
  requestAnimationFrame(()=>{ bodyTarget.style.opacity = '1'; });
  if(barHTML){ chatBar.innerHTML = barHTML; chatBar.style.display = 'block'; }
  return step;
}

/* ---------------- MATCHING ENGINE ---------------- */
const TITLE_STOPWORDS = new Set([
  "job","jobs","vacancy","vacancies","post","posted","hiring","wanted","required","urgent",
  "at","for","the","and","in","of","a","an","to","with","new",
  "maldives","island","islands","resort","hotel","guesthouse",
  "full","part","time","fulltime","parttime",
]);
function titleTokens(t){
  return (t || '').toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/)
    .filter(w => w.length > 2 && !TITLE_STOPWORDS.has(w));
}
function normSkill(s){ return (s || '').toLowerCase().trim().replace(/[^a-z0-9 ]/g,''); }
function skillsRelate(a, b){
  if(!a || !b) return false;
  if(a === b) return true;
  const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return new RegExp(`\\b${esc(a)}\\b`).test(b) || new RegExp(`\\b${esc(b)}\\b`).test(a);
}

function buildSearchQueries(){
  if(keywordJobTitles && keywordJobTitles.length){
    return keywordJobTitles.slice(0, 5);
  }

  const skills = chatAnswers.skills.map(normSkill).filter(Boolean);
  const queries = new Set();

  if(chatAnswers.title && chatAnswers.title.trim()) queries.add(chatAnswers.title.trim());

  Object.entries(SKILL_KEYWORDS).forEach(([titleFragment, tags])=>{
    const tagsNorm = tags.map(normSkill);
    if(skills.some(us => tagsNorm.some(t => skillsRelate(us, t)))){
      queries.add(titleFragment.trim());
    }
  });

  if(queries.size === 0){
    chatAnswers.skills.forEach(sk => queries.add(sk));
  }

  return [...queries].slice(0, 5);
}

async function deepenSearch(queries){
  if(!queries.length) return { added: 0, statuses: [] };
  const searchableSources = SOURCES.filter(s => typeof s.searchUrl === 'function');
  if(!searchableSources.length) return { added: 0, statuses: [] };

  const tasks = [];
  searchableSources.forEach(source=>{
    queries.forEach(q=>{
      tasks.push(
        scrapeSource(source, 1, source.searchUrl(q))
          .then(r => ({ ...r, query: q }))
      );
    });
  });
  const results = await Promise.all(tasks);

  const existingUrls = new Set(JOBS.map(j => j.url));
  let added = 0;
  results.forEach(r=>{
    r.jobs.forEach(job=>{
      if(!existingUrls.has(job.url)){
        JOBS.push(job);
        existingUrls.add(job.url);
        added++;
      }
    });
  });

  ALL_SKILLS = [...new Set(JOBS.flatMap(j=>j.skills))].sort();
  ALL_TITLES = [...new Set(JOBS.map(j=>j.title))].sort();

  return {
    added,
    statuses: results.map(r => ({ site: r.site, query: r.query, count: r.jobs.length, error: r.error })),
  };
}

function getJobIcon(title){

  if(/graphic|design|illustrator|photoshop|figma|art|drawing|sketch|paint|brush|illustration/.test(t)) return 'brush';
  if(/developer|software|engineer|programmer|coding|programming|web|frontend|backend|fullstack|ai|machine learning|data|analyst|cyber|security/.test(t)) return 'code';
  if(/chef|cook|baker|pastry|restaurant|kitchen|culinary|food/.test(t)) return 'restaurant';
  if(/nurse|doctor|medical|healthcare|clinical|patient|doctor|dentist|pharmacy|vet/.test(t)) return 'health';
  if(/teacher|tutor|lecturer|professor|instructor|education|school|university/.test(t)) return 'school';
  if(/account|finance|audit|bookkeeping|tax|payroll|bank/.test(t)) return 'account';
  if(/engineer|construction|architect|civil|mechanical|electrical|plumber|electrician|carpenter|welder|mechanic/.test(t)) return 'build';
  if(/pilot|flight|aviation|airport|airline|captain|first officer/.test(t)) return 'flight';

  if(/fitness|sports|coach|trainer|athletic|gym|personal training/.test(t)) return 'sports';

function scoreJobs(){
  const years = Number(chatAnswers.years);
  const desiredTitle = chatAnswers.title || "";
  const area = chatAnswers.area;
  const hours = chatAnswers.hours;
  const mode = chatAnswers.mode;
  const skills = chatAnswers.skills.map(normSkill).filter(Boolean);
  const desiredTitleWords = titleTokens(desiredTitle);

  let results = JOBS.map(job=>{
    let score = 0;
    let skillMatchRatio = 0;
    let titleMatchRatio = 0;

    if(job.skills.length && skills.length){
      const jobSkillsNorm = job.skills.map(normSkill).filter(Boolean);
      const matched = jobSkillsNorm.filter(js => skills.some(us => skillsRelate(us, js)));
      skillMatchRatio = matched.length / jobSkillsNorm.length;
      score += Math.min(1, skillMatchRatio) * 40;
    }

    if(desiredTitleWords.length){
      const jobTitleWords = titleTokens(job.title);
      if(job.title.toLowerCase().trim() === desiredTitle.toLowerCase().trim()){
        titleMatchRatio = 1;
      } else {
        const common = desiredTitleWords.filter(w => jobTitleWords.includes(w));
        titleMatchRatio = common.length / desiredTitleWords.length;
      }
      score += titleMatchRatio * 25;
    } else {
      score += 8;
    }

    if(years >= job.minYears) score += 15;
    else score += Math.max(0, 15 - (job.minYears - years) * 6);

    if(area === "Any" || job.area === "Any" || job.area === area) score += 10;
    else score += 2;

    if(hours === "Any" || job.type === hours) score += 5;

    if(mode === "Any" || job.mode === mode) score += 5;

    return { job, score: Math.round(score), skillMatchRatio, titleMatchRatio };
  });

  const gaveSkills = skills.length > 0;
  const gaveTitle = desiredTitleWords.length > 0;
  let filtered = results;
  if(gaveSkills || gaveTitle){
    filtered = results.filter(r => {
      const skillKnown = r.job.skills.length > 0;
      if(gaveSkills && gaveTitle){
        if(r.titleMatchRatio > 0) return true;
        if(skillKnown && r.skillMatchRatio > 0) return true;
        return false;
      }
      if(gaveSkills){
        return skillKnown ? r.skillMatchRatio > 0 : true;
      }
      return r.titleMatchRatio > 0;
    });
  }

  const wantsHours = hours !== "Any";
  const wantsMode = mode !== "Any";
  if(wantsHours || wantsMode){
    const attributeChecked = filtered.filter(r=>{
      const hoursOk = !wantsHours || r.job.type === hours;
      const modeOk = !wantsMode || r.job.mode === mode;
      return hoursOk && modeOk;
    });
    if(attributeChecked.length >= Math.min(3, filtered.length)){
      filtered = attributeChecked;
    }
  }
  if(filtered.length < 3){
    const backfill = results.slice().sort((a,b)=> b.score - a.score)
      .filter(r => !filtered.includes(r));
    filtered = filtered.concat(backfill.slice(0, 6 - filtered.length));
  }
  results = filtered;

  return results
    .map(r => ({ job: r.job, score: Math.max(4, Math.min(99, r.score)) }))
    .sort((a,b)=> b.score - a.score);
}

      btn.classList.add('picked');
      setTimeout(()=>{
        if(btn.dataset.val === 'yes') startSwipeGame(lastResults);
        else renderResultsInChat();
      }, 350);
    });
  });
}

const RESULTS_INTROS = [
  n => `Here's what I found — these are your ${n} best matches, ranked by how closely they line up with everything you told me. Have a look, and tap into any of them to apply directly on the source site.`,
  n => `Nice — I dug through every board and found ${n} jobs worth a look. They're sorted best-fit first, so start from the top and work your way down.`,
  n => `Done! Here are the ${n} openings that fit best, based on your skills, experience, and preferences. Tap "Apply" on any card to head straight to the original listing.`,
];
const RESULTS_EMPTY = [
  "I couldn't find any live listings that genuinely match what you're after right now — the boards may just be quiet at the moment, or your answers might be narrowing things down more than expected. Try loosening a preference, or check back after the boards refresh.",
  "Nothing matched closely enough this time around. That doesn't necessarily mean there's nothing out there — try widening one of your answers, or check back once the boards have had a chance to update.",
];

async function renderResultsInChat(){
  const items = lastResults;
  const summary = items.length ? pick(RESULTS_INTROS)(items.length) : pick(RESULTS_EMPTY);

  const bodyHtml = (items.length ? `<div class="cards-grid" id="chat-results-grid"></div>` : '')
    + `<div class="chat-input-row"><button type="button" class="btn btn-ghost" id="chat-restart">Start over <span class="msym">refresh</span></button></div>`;

  const step = await renderStep([summary], bodyHtml);
  step.style.minHeight = '0';

  if(items.length){
    renderCards(step.querySelector('#chat-results-grid'), items);
  }
  step.querySelector('#chat-restart').addEventListener('click', restartChat);
  pageFooter.classList.add('show');
}

function renderCards(grid, items){
  items.forEach((r, i)=>{
    const card = document.createElement('div');
    const color = CARD_COLORS_LIST[i % CARD_COLORS_LIST.length];
    card.className = `job-card ${color}`;
    card.style.animationDelay = (i*0.06)+'s';
    const icon = getJobIcon(r.job.title);
    card.dataset.icon = icon;

    const circumference = 2 * Math.PI * 24;
    const offset = circumference - (r.score/100) * circumference;

    card.innerHTML = `
      <div class="top-row">
        <span class="source-tag">${r.job.site}</span>
        <div class="match-ring">
          <svg viewBox="0 0 56 56">
            <circle class="bg" cx="28" cy="28" r="24"></circle>
            <circle class="fg" cx="28" cy="28" r="24" stroke-dasharray="${circumference}" stroke-dashoffset="${circumference}"></circle>
          </svg>
          <div class="val">${r.score}%</div>
        </div>
      </div>
      <span class="job-icon msym">${icon}</span>
      <h4>${r.job.title}</h4>
      <div class="company">${r.job.logoUrl ? `<img src="${r.job.logoUrl}" alt="" style="width:16px;height:16px;object-fit:contain;border-radius:3px" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'msym',textContent:'storefront',style:'font-size:16px'}))">` : `<span class="msym" style="font-size:16px">storefront</span>`} ${r.job.company || 'Employer not listed — check posting'}</div>
      <div class="meta-row">
        <div class="meta-pill"><span class="msym">location_on</span> ${r.job.area}</div>
        <div class="meta-pill"><span class="msym">schedule</span> ${r.job.type}</div>
        <div class="meta-pill"><span class="msym">home_work</span> ${r.job.mode}</div>
      </div>
      <div class="skill-line"><b>Key skills</b>${r.job.skills.join(', ')}</div>
      <button class="apply-btn" data-url="${r.job.url}" data-title="${r.job.title}">
        <div class="fill-anim"></div>
        <span class="msym">rocket_launch</span>
        <span>Apply on ${r.job.site}</span>
      </button>
    `;
    grid.appendChild(card);

    requestAnimationFrame(()=>{
      const fg = card.querySelector('.match-ring .fg');
      setTimeout(()=>{ fg.style.strokeDashoffset = offset; }, 80 + i*40);
    });

    card.querySelector('.apply-btn').addEventListener('click', function(){
      launchApply(this);
    });
  });
}

/* ---------------- SWIPE GAME ---------------- */
let swipeQueue = [];
let swipeHistory = [];
let likedJobs = [];
let swipeTotal = 0;

function startSwipeGame(items){
  swipeQueue = items.slice();
  swipeHistory = [];
  likedJobs = [];
  swipeTotal = items.length;
  pageFooter.classList.remove('show');
  chatBar.innerHTML = ''; chatBar.style.display = 'none';
  renderSwipeGame();
}

function renderSwipeGame(){
  if(swipeQueue.length === 0){ renderGameResults(); return; }

  const done = swipeTotal - swipeQueue.length;
  chatWindow.innerHTML = `
    <div class="chat-step game-step">
      <div class="game-topbar">
        <button type="button" class="game-icon-btn" id="game-undo" ${swipeHistory.length ? '' : 'disabled'} title="Undo last swipe"><span class="msym">undo</span></button>
        <div class="game-progress">
          <div class="game-progress-track"><div class="game-progress-fill" style="width:${(done/swipeTotal*100).toFixed(1)}%"></div></div>
          <span class="game-progress-label">${done} of ${swipeTotal} &middot; ${likedJobs.length} saved</span>
        </div>
        <button type="button" class="game-icon-btn" id="game-skip-all" title="Show the full list instead"><span class="msym">list</span></button>
      </div>
      <div class="swipe-stack" id="swipe-stack"></div>
      <div class="game-actions">
        <button type="button" class="swipe-action-btn pass" id="game-pass" title="Pass"><span class="msym">close</span></button>
        <button type="button" class="swipe-action-btn like" id="game-like" title="Save this one"><span class="msym">favorite</span></button>
      </div>
      <div class="game-hint">Drag a card, or use the buttons — swipe right to save, left to pass.</div>
    </div>
  `;
  window.scrollTo(0,0);

  const stack = document.getElementById('swipe-stack');
  const visible = swipeQueue.slice(0, 1);
  visible.slice().reverse().forEach((r, idxFromBack)=>{
    const depth = visible.length - 1 - idxFromBack;
    stack.appendChild(buildSwipeCard(r, depth));
  });
  wireSwipeCard(stack.querySelector('.swipe-card[data-depth="0"]'));

  const doPass = ()=>{ const top = stack.querySelector('.swipe-card[data-depth="0"]'); top ? flyCard(top, 'pass') : commitSwipe('pass'); };
  const doLike = ()=>{ const top = stack.querySelector('.swipe-card[data-depth="0"]'); top ? flyCard(top, 'like') : commitSwipe('like'); };
  document.getElementById('game-pass').addEventListener('click', doPass);
  document.getElementById('game-like').addEventListener('click', doLike);
  document.getElementById('game-undo').addEventListener('click', undoSwipe);
  document.getElementById('game-skip-all').addEventListener('click', renderResultsInChat);
}

function buildSwipeCard(r, depth){
  const color = CARD_COLORS_LIST[(swipeTotal - swipeQueue.indexOf(r)) % CARD_COLORS_LIST.length];
  const div = document.createElement('div');
  div.className = `swipe-card job-card ${color}${depth === 0 ? ' entering' : ''}`;
  div.dataset.depth = depth;
  div.style.setProperty('--depth', depth);
  const icon = getJobIcon(r.job.title);
  div.dataset.icon = icon;

  const circumference = 2 * Math.PI * 24;
  const offset = circumference - (r.score/100) * circumference;

  div.innerHTML = `
    <div class="swipe-stamp like">Saved</div>
    <div class="swipe-stamp pass">Pass</div>
    <div class="top-row">
      <span class="source-tag">${r.job.site}</span>
      <div class="match-ring">
        <svg viewBox="0 0 56 56">
          <circle class="bg" cx="28" cy="28" r="24"></circle>
          <circle class="fg" cx="28" cy="28" r="24" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"></circle>
        </svg>
        <div class="val">${r.score}%</div>
      </div>
    </div>
    <span class="job-icon msym">${icon}</span>
    <h4>${r.job.title}</h4>
    <div class="company">${r.job.logoUrl ? `<img src="${r.job.logoUrl}" alt="" style="width:16px;height:16px;object-fit:contain;border-radius:3px" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'msym',textContent:'storefront',style:'font-size:16px'}))">` : `<span class="msym" style="font-size:16px">storefront</span>`} ${r.job.company || 'Employer not listed — check posting'}</div>
    <div class="meta-row">
      <div class="meta-pill"><span class="msym">location_on</span> ${r.job.area}</div>
      <div class="meta-pill"><span class="msym">schedule</span> ${r.job.type}</div>
      <div class="meta-pill"><span class="msym">home_work</span> ${r.job.mode}</div>
    </div>
    <div class="skill-line"><b>Key skills</b>${r.job.skills.join(', ')}</div>
  `;
  return div;
}

function wireSwipeCard(card){
  if(!card) return;
  let startX = 0, startY = 0, dx = 0, dy = 0, dragging = false;
  const threshold = 100;
  const likeStamp = card.querySelector('.swipe-stamp.like');
  const passStamp = card.querySelector('.swipe-stamp.pass');

  card.addEventListener('pointerdown', e=>{
    dragging = true;
    card.classList.add('dragging');
    startX = e.clientX; startY = e.clientY;
    try{ card.setPointerCapture(e.pointerId); }catch(err){}
  });
  card.addEventListener('pointermove', e=>{
    if(!dragging) return;
    dx = e.clientX - startX; dy = e.clientY - startY;
    card.style.transform = `translate(${dx}px, ${dy*0.35}px) rotate(${dx/16}deg)`;
    likeStamp.style.opacity = Math.max(0, Math.min(1, dx/threshold));
    passStamp.style.opacity = Math.max(0, Math.min(1, -dx/threshold));
  });
  const release = ()=>{
    if(!dragging) return;
    dragging = false;
    card.classList.remove('dragging');
    if(dx > threshold) flyCard(card, 'like');
    else if(dx < -threshold) flyCard(card, 'pass');
    else{
      card.style.transform = '';
      likeStamp.style.opacity = 0;
      passStamp.style.opacity = 0;
    }
    dx = 0; dy = 0;
  };
  card.addEventListener('pointerup', release);
  card.addEventListener('pointercancel', release);
}

function flyCard(card, decision){
  const dir = decision === 'like' ? 1 : -1;
  card.classList.add('dragging');
  card.style.transition = 'transform .38s cubic-bezier(.22,1,.36,1), opacity .38s';
  card.style.transform = `translate(${dir*560}px, -30px) rotate(${dir*26}deg)`;
  card.style.opacity = '0';
  card.querySelector('.swipe-stamp.like').style.opacity = decision === 'like' ? 1 : 0;
  card.querySelector('.swipe-stamp.pass').style.opacity = decision === 'pass' ? 1 : 0;
  setTimeout(()=> commitSwipe(decision), 300);
}

function commitSwipe(decision){
  if(swipeQueue.length === 0) return;
  const item = swipeQueue.shift();
  swipeHistory.push({ item, decision });
  if(decision === 'like') likedJobs.push(item);
  renderSwipeGame();
}

function undoSwipe(){
  if(swipeHistory.length === 0) return;
  const last = swipeHistory.pop();
  if(last.decision === 'like'){
    const idx = likedJobs.lastIndexOf(last.item);
    if(idx !== -1) likedJobs.splice(idx, 1);
  }
  swipeQueue.unshift(last.item);
  renderSwipeGame();
}

async function renderGameResults(){
  pageFooter.classList.remove('show');
  const n = likedJobs.length;
  const summary = n > 0
    ? `That's the deck! You saved ${n} out of ${swipeTotal} — here they are, ready whenever you want to apply.`
    : `That's the whole deck — none of them quite clicked this round. You can start over with different answers, or take a look at the full list instead.`;
  const bodyHtml = (n > 0 ? `<div class="cards-grid" id="chat-results-grid"></div>` : '')
    + `<div class="chat-input-row">
         <button type="button" class="btn btn-ghost" id="chat-restart">Start over <span class="msym">refresh</span></button>
         <button type="button" class="btn btn-ghost" id="chat-see-all">See full list <span class="msym">list</span></button>
       </div>`;

  const step = await renderStep([summary], bodyHtml);
  step.style.minHeight = '0';
  if(n > 0) renderCards(step.querySelector('#chat-results-grid'), likedJobs);
  step.querySelector('#chat-restart').addEventListener('click', restartChat);
  step.querySelector('#chat-see-all').addEventListener('click', renderResultsInChat);
  pageFooter.classList.add('show');
}

function restartChat(){
  chatAnswers.skills = []; chatAnswers.years = 2; chatAnswers.title = '';
  chatAnswers.area = 'Any'; chatAnswers.hours = 'Any'; chatAnswers.mode = 'Any';
  keywordJobTitles = null;
  chatIndex = 0;
  isRestart = true;
  askStep(0);
}

function startChat(){
  initJobs();
  askStep(0);
}

startChat();

/* ---------------- GAMIFIED APPLY FLOW ---------------- */
function launchApply(btn){
  if(btn.classList.contains('launching')) return;
  btn.classList.add('launching');
  const originalHTML = btn.innerHTML;
  btn.innerHTML = `<div class="fill-anim" style="width:100%"></div><span class="msym">bolt</span><span>Launching portal...</span>`;

  burstConfetti(btn);

  const url = btn.dataset.url;
  const title = btn.dataset.title;

  setTimeout(()=>{
    window.open(url, '_blank');
    showToast(`Opening ${new URL(url).hostname.replace('www.','')} for "${title}"`);
    btn.innerHTML = `<span class="msym">check_circle</span><span>Portal opened</span>`;
    setTimeout(()=>{
      btn.classList.remove('launching');
      btn.innerHTML = originalHTML;
    }, 1800);
  }, 750);
}

function burstConfetti(el){
  const rect = el.getBoundingClientRect();
  const colors = ['#4FD1C5','#FF9E80','#A87BFF','#FF7A8A','#6AE0A0'];
  for(let i=0;i<26;i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = (rect.left + rect.width/2 + (Math.random()*160-80)) + 'px';
    piece.style.top = (rect.top - 10) + 'px';
    piece.style.background = colors[Math.floor(Math.random()*colors.length)];
    piece.style.animationDelay = (Math.random()*0.15)+'s';
    piece.style.transform = `rotate(${Math.random()*360}deg)`;
    document.body.appendChild(piece);
    setTimeout(()=> piece.remove(), 1300);
  }
}

function showToast(msg){
  const toast = document.getElementById('toast');
  document.getElementById('toast-text').textContent = msg;
  toast.classList.add('show');
  setTimeout(()=> toast.classList.remove('show'), 3200);
}
