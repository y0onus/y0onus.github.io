<style>

nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.logo{width:72px;height:72px;margin:0 auto 12px;color:var(--t);display:flex;align-items:center;justify-content:center;font-size:60px;line-height:1}
#top{max-width:1100px;margin:0 auto;padding:8px 16px 0;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--t2)}#top button{min-height:44px;border:0;background:none;color:var(--ac);font-size:15px;cursor:pointer}#err{color:var(--r);min-height:20px}

@media(min-width:900px){
 .shell{margin-left:236px}#app.solo .shell{margin-left:0}

 nav::before{content:'ވ  Vote Tracker';position:absolute;top:24px;left:24px;font-weight:600;font-size:18px}
 nav a{flex:none;max-width:none;min-height:44px;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 14px;font-size:15px;border-radius:12px}
 main{padding:20px 40px 60px}#top{padding:12px 40px 0}
 h1{font-size:36px}
 .filters{grid-template-columns:2fr 1.4fr 1fr 1fr}.filters .fq{grid-column:auto}
 .chips{margin:12px 0 4px;padding:0}

 .perms{grid-template-columns:repeat(4,1fr)}
 .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.two>.card{margin-top:8px}
}
</style></head><body>
<div id="login"><form id="lf"><div class="logo">ވ</div><h1>Vote Tracker</h1><p class="sub" style="margin-bottom:20px">Sign in to continue</p><input id="em" type="email" autocapitalize="off" autocomplete="username" placeholder="Email"><input id="pw" type="password" placeholder="Password" autocomplete="current-password"><p id="err" class="cap"></p><button class="btn w" id="lb">Sign in</button></form></div>

<div id="toast"></div>
<script>
const DB='https://votedata-default-rtdb.asia-southeast1.firebasedatabase.app',
FB_KEY='AIzaSyArLukjEGjH-qZ0jPWyvQH9KFjTrr28OcE',   // Firebase console > Project settings > General > Web API Key
BOOT='voteadmin@yoz.lol';                    // this account becomes the first admin automatically
const IT='https://identitytoolkit.googleapis.com/v1/accounts:';
const FLAGS=[['dash','Dashboard','Totals and charts'],['list','List','Voter list, filters, mobile numbers'],['seeIntent','See Yes / No','See who said yes or no'],['editIntent','Change Yes / No','Mark and change pledges'],['entries','Add entries','Enter numbers at the hall'],['allEntries','All entries','See and remove every entry'],['upload','Data tools','Upload, backups, clear entries'],['users','Users','Manage users and devices']];
const PRESETS={admin:['dash','list','seeIntent','editIntent','entries','allEntries','upload','users'],mod:['entries'],callcenter:['list'],custom:[]};
const mk=a=>Object.fromEntries(FLAGS.map(f=>[f[0],a.includes(f[0])]));
const LABELS={dash:'Dashboard',list:'List',entries:'Entries',settings:'Settings'},
ICONS={dash:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>',list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',entries:'<path d="M20 6 9 17l-5-5"/>',settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/>'},
PHONE='<svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>',LIMIT=150;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2800)}
// ---------- Firebase auth (REST) ----------
let auth=null,profile=null,perm={};
const post=(u,b)=>fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(((j.error&&j.error.message)||'ERROR').split(' ')[0]);return j});
const jwt=t=>{try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))}catch(e){return{}}};
function setAuth(id,ref,uid,ex){auth={id,ref,uid,email:(jwt(id).email||'').toLowerCase(),exp:Date.now()+ex*1000};try{localStorage.setItem('ec_auth',JSON.stringify({ref}))}catch(e){}}
async function refresh(){const r=await fetch('https://securetoken.googleapis.com/v1/token?key='+FB_KEY,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(auth.ref)});const j=await r.json();if(!r.ok)throw Error('SESSION_EXPIRED');setAuth(j.id_token,j.refresh_token,j.user_id,+j.expires_in)}
let rp=null;async function tok(){if(auth.exp-Date.now()<300000){rp=rp||refresh().finally(()=>rp=null);await rp}return auth.id}
async function api(p,m='GET',b,x={}){const t=await tok(),qs=new URLSearchParams(Object.assign({auth:t},x.q||{}));const r=await fetch(`${DB}/${p}.json?${qs}`,{method:m,body:b===undefined?undefined:JSON.stringify(b),keepalive:!!x.ka});if(!r.ok)throw Object.assign(Error('HTTP '+r.status),{status:r.status});return r.json()}
const AE={INVALID_LOGIN_CREDENTIALS:'Incorrect email or password',INVALID_PASSWORD:'Incorrect email or password',EMAIL_NOT_FOUND:'Incorrect email or password',INVALID_EMAIL:'Enter a valid email',USER_DISABLED:'This account is disabled',TOO_MANY_ATTEMPTS_TRY_LATER:'Too many attempts. Try again later',SESSION_EXPIRED:'Session expired. Sign in again',API_KEY_INVALID:'The Firebase API key in the file is wrong'};
// ---------- state ----------
const VM={},IM={},EM={},UM={},PM={},MAPS={voters:VM,intents:IM,entries:EM,users:UM,presence:PM},ready={};
let S={voters:[],entries:[],map:new Map(),boxes:[],sexes:[],links:[]},page='dash',stab='general',q='',flt='all',fb='',fsx='',fv='',eq='',last=null,conn='connecting',srvOff=0,lastSnap=0,lastSig='';
try{S.links=JSON.parse(localStorage.getItem('ec_vote_links'))||[]}catch(e){}
const saveLinks=()=>{try{localStorage.setItem('ec_vote_links',JSON.stringify(S.links))}catch(e){}};
const DEV=(()=>{let d=localStorage.getItem('ec_dev');if(!d){d=Math.random().toString(36).slice(2,10);try{localStorage.setItem('ec_dev',d)}catch(e){}}return d})();
const pg=()=>{const a=[];if(perm.dash)a.push('dash');if(perm.list)a.push('list');if(perm.entries||perm.allEntries)a.push('entries');if(perm.upload||perm.users)a.push('settings');return a};
const want={voters:()=>perm.list||perm.dash,intents:()=>perm.seeIntent,entries:()=>perm.allEntries,users:()=>perm.users,presence:()=>perm.users};
const connText=()=>({live:'● Live',offline:'○ Offline, retrying',denied:'✕ No access to some data'}[conn]||'… Connecting');
function setConn(c){conn=c;const el=$('#st');if(el)el.textContent=connText();const g=$('#cst');if(g)g.textContent=connText()}
function applyEv(R,path,data,isPatch){const p=path.split('/').filter(Boolean);
if(!p.length){if(isPatch){for(const k in data){if(data[k]==null)delete R[k];else R[k]=data[k]}}else{for(const k in R)delete R[k];const d=Array.isArray(data)?Object.fromEntries(data.map((x,i)=>[i,x]).filter(x=>x[1]!=null)):(data&&typeof data=='object'?data:{});Object.assign(R,d)}return}
const k=p[0];
if(p.length==1){if(isPatch){const o=R[k]=R[k]||{};for(const f in data){if(data[f]==null)delete o[f];else o[f]=data[f]}}else if(data==null)delete R[k];else R[k]=data;return}
const o=R[k]=(R[k]&&typeof R[k]=='object')?R[k]:{};if(data==null)delete o[p[1]];else o[p[1]]=data}
// ---------- live streams ----------
const ES={},RT={};
async function open(name){if(ES[name])ES[name].close();clearTimeout(RT[name]);let t;try{t=await tok()}catch(e){return setConn('offline')}
const es=ES[name]=new EventSource(`${DB}/${name}.json?auth=${encodeURIComponent(t)}`),R=MAPS[name];
const h=isP=>e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}applyEv(R,m.path,m.data,isP);if(m.path=='/'&&!isP)ready[name]=true;if(name=='presence')paintDevices();else if(name=='users')paintLive();else rebuild()};
es.addEventListener('put',h(false));es.addEventListener('patch',h(true));
es.addEventListener('auth_revoked',()=>{es.close();auth.exp=0;RT[name]=setTimeout(()=>open(name),400)});
es.addEventListener('cancel',()=>{es.close();setConn('denied')});
es.onopen=()=>setConn('live');
es.onerror=()=>{setConn('offline');if(es.readyState==2)RT[name]=setTimeout(()=>open(name),5000)}}
const connect=()=>Object.keys(MAPS).filter(n=>want[n]()).forEach(open);
let rb;function rebuild(now){clearTimeout(rb);const run=()=>{const V=Object.keys(VM).map(k=>Object.assign({no:+k.slice(1),intent:IM[k]||'',voted:!!EM[k]},VM[k],{intent:IM[k]||''})).sort((a,b)=>a.no-b.no);
S.voters=V;S.map=new Map(V.map(v=>[v.no,v]));S.entries=Object.keys(EM).map(k=>({no:+k.slice(1),ts:(EM[k]&&+EM[k].ts)||0})).sort((a,b)=>b.ts-a.ts);
S.boxes=[...new Set(V.map(v=>v.island).filter(Boolean))].sort();S.sexes=[...new Set(V.map(v=>v.sex).filter(Boolean))].sort();repaint()};now?run():rb=setTimeout(run,60)}
function fillSel(id,arr,cur){const el=$(id);if(!el)return;const f=el.options[0].textContent;el.innerHTML=`<option value="">${f}</option>`+arr.map(x=>`<option value="${esc(x)}"${x==cur?' selected':''}>${esc(x)}</option>`).join('')}
function chips(){const s=stats(),n={all:['All',s.total],yes:['Yes',s.yes],no:['No',s.no],un:['Not asked',s.unset]};document.querySelectorAll('.chips button').forEach(x=>x.textContent=n[x.dataset.v].join(' '))}
function repaint(){if($('#app').hidden)return;if(page=='list'){fillSel('#fb',S.boxes,fb);fillSel('#fs',S.sexes,fsx);paintRows();chips()}else if(page=='entries')paintLog();else if(page=='dash')render();else paintLive()}
function stats(){const v=S.voters;let yes=0,no=0;for(const x of v){if(x.intent=='yes')yes++;else if(x.intent=='no')no++}let ver=0;for(const e of S.entries){const p=S.map.get(e.no);if(p&&p.intent=='yes')ver++}return{total:v.length,yes,no,unset:v.length-yes-no,voted:S.entries.length,ver,other:S.entries.length-ver}}
function byBox(){const m={};for(const v of S.voters){const b=v.island||'-',o=m[b]=m[b]||{t:0,y:0,n:0,v:0};o.t++;if(v.intent=='yes')o.y++;else if(v.intent=='no')o.n++;if(v.voted)o.v++}return Object.entries(m).sort((a,b)=>b[1].t-a[1].t)}
// ---------- devices ----------
const srvNow=()=>Date.now()+srvOff,online=()=>Object.entries(PM).filter(([k,p])=>p&&srvNow()-p.ts<75000);

if(ix.no<0)throw Error('No “#” column found');const g=(r,k)=>ix[k]<0?'':String(r[ix[k]]??'').trim();
const vp={},ip={};let add=0,upd=0;
for(const r of rows.slice(hi+1)){const no=Number(r[ix.no]),name=String(r[ix.name]||'').replace(/\s+/g,' ').trim();if(!no||!name)continue;
const o={name,nid:g(r,'nid'),island:g(r,'isl'),address:g(r,'adr'),sex:g(r,'sex'),mobile:g(r,'mob')},it=norm(g(r,'it')),k='n'+no,p=VM[k];
if(p){vp[k]={name:o.name,nid:o.nid||p.nid||'',island:o.island||p.island||'',address:o.address||p.address||'',sex:o.sex||p.sex||'',mobile:o.mobile||p.mobile||''};upd++;if(!IM[k]&&(p.intent||it))ip[k]=p.intent||it}else{vp[k]=o;add++;if(it)ip[k]=it}}
await chunk('voters',vp);await chunk('intents',ip);audit(`Uploaded list: ${add} added, ${upd} updated`);return`${add} added, ${upd} updated`}
async function loadLink(i){toast('Loading…');try{const r=await fetch(toCsv(S.links[i]));if(!r.ok)throw Error('HTTP '+r.status);toast(await merge(parseCSV(await r.text())))}catch(e){toast('Could not load link ('+e.message+'). Make sure it is shared, or upload the file instead.')}}
async function loadFile(f){try{let rows;if(/\.csv$/i.test(f.name))rows=parseCSV(await f.text());else{if(!window.XLSX)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=()=>no(Error('could not load the xlsx reader'));document.head.appendChild(s)});const wb=XLSX.read(await f.arrayBuffer());rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''})}toast('Uploading…');toast(await merge(rows))}catch(e){toast('Import failed: '+e.message)}}
async function restoreFile(f){try{const d=JSON.parse(await f.text());let v,i,en;
if(Array.isArray(d.voters)){v={};i={};en={};d.voters.forEach(x=>{const{no,intent,...r}=x;v['n'+no]=r;if(intent)i['n'+no]=intent});(d.entries||[]).forEach(x=>en['n'+x.no]={ts:x.ts,by:auth.uid})}else if(d.voters){v=d.voters;i=d.intents||null;en=d.entries||null}else throw 0;
if(!confirm('Replace the data on the server with this file? A snapshot is taken first.'))return;await snapshot(true,'before file restore');await api('voters','PUT',v);await api('intents','PUT',i);await api('entries','PUT',en);audit('Restored from backup file');toast('Backup restored')}catch(x){toast('Not a valid backup file')}}
// ---------- events ----------
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,no=+b.dataset.no,i=+b.dataset.i,uid=b.dataset.uid;
if(a=='set'){const k='n'+no,old=IM[k]||'',v=b.dataset.v,nv=old==v?'':v;if(nv)IM[k]=nv;else delete IM[k];rebuild(true);api('intents/'+k,'PUT',nv||null).catch(()=>{if(old)IM[k]=old;else delete IM[k];rebuild(true);toast('Not saved. Check your connection')})}
else if(a=='flt'){flt=b.dataset.v;render()}
else if(a=='add')addEntry();
else if(a=='del'){if(confirm('Remove entry #'+no+'?')){const k='n'+no,old=EM[k];delete EM[k];rebuild(true);api('entries/'+k,'DELETE').then(()=>audit('Removed entry #'+no)).catch(()=>{EM[k]=old;rebuild(true);toast('Not removed. Check your connection')})}}
else if(a=='stab'){stab=b.dataset.v;render()}
else if(a=='uadd')addUser();
else if(a=='ureset'){try{await post(IT+'sendOobCode?key='+FB_KEY,{requestType:'PASSWORD_RESET',email:UM[uid].email});toast('Reset email sent to '+UM[uid].email)}catch(x){toast('Could not send: '+x.message)}}
else if(a=='utoggle'){const off=!UM[uid].off;api(`users/${uid}/off`,'PUT',off).then(()=>audit((off?'Disabled ':'Enabled ')+UM[uid].email)).catch(()=>toast('Failed'))}
else if(a=='udel'){if(confirm('Remove '+UM[uid].email+'? They lose all access.')){const em=UM[uid].email;api('users/'+uid,'DELETE').then(()=>audit('Removed user '+em)).catch(()=>toast('Failed'))}}
else if(a=='prune')pruneDevices();
else if(a=='snap'){toast('Backing up…');try{await snapshot(true,'manual');audit('Manual backup');toast('Backup saved');loadSnaps()}catch(x){toast('Backup failed: '+x.message)}}
else if(a=='restoresnap')restoreSnap(b.dataset.k);
else if(a=='addlink'){const u=$('#lnk').value.trim();if(!/^https?:\/\//.test(u))return toast('Enter a full link starting with https://');if(!S.links.includes(u))S.links.push(u);saveLinks();$('#lnk').value='';paintLinks();loadLink(S.links.indexOf(u))}
else if(a=='load')loadLink(i);
else if(a=='rmlink'){S.links.splice(i,1);saveLinks();paintLinks()}
else if(a=='pick')$('#file').click();else if(a=='pickb')$('#bfile').click();
else if(a=='export')dl('vote-tracker-backup.json',new Blob([JSON.stringify({v:2,at:Date.now(),voters:VM,intents:IM,entries:EM})],{type:'application/json'}));
else if(a=='csv')exportCsv();
else if(a=='clear'){if(confirm('Clear ALL entries for everyone? This cannot be undone.')){try{await snapshot(true,'before clear');await api('entries','DELETE');last=null;audit('Cleared all entries');toast('Entries cleared')}catch(x){toast('Not cleared: '+x.message)}}}
else if(a=='out')signOut()});
document.addEventListener('input',e=>{if(e.target.id=='q'){q=e.target.value;paintRows()}if(e.target.id=='eq'){eq=e.target.value;paintLog()}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.id=='num'){e.preventDefault();addEntry()}});
document.addEventListener('change',async e=>{const t=e.target,a=t.dataset.a;
if(a=='f'){if(t.id=='fb')fb=t.value;if(t.id=='fs')fsx=t.value;if(t.id=='fv')fv=t.value;paintRows();return}
if(a=='nrole'){const p=PRESETS[t.value];document.querySelectorAll('.nuf').forEach(c=>c.checked=p.includes(c.value));return}
if(a=='urole'){const uid=t.dataset.uid;if(uid==auth.uid&&t.value!='admin'&&!confirm('Change your own role?')){paintUsers();return}api('users/'+uid,'PATCH',{role:t.value,perm:mk(PRESETS[t.value])}).then(()=>audit(`Role of ${UM[uid].email} set to ${t.value}`)).catch(()=>toast('Failed'));return}
if(a=='uperm'){const uid=t.dataset.uid;if(uid==auth.uid&&!t.checked&&t.dataset.f=='users'){toast("You can't remove your own Users permission");paintUsers();return}api('users/'+uid,'PATCH',{role:'custom',perm:Object.assign({},UM[uid].perm,{[t.dataset.f]:t.checked})}).then(()=>audit(`${UM[uid].email}: ${t.dataset.f} ${t.checked?'on':'off'}`)).catch(()=>toast('Failed'));return}
const f=t.files&&t.files[0];if(!f)return;if(t.id=='file')loadFile(f);if(t.id=='bfile')restoreFile(f);t.value=''});
window.addEventListener('hashchange',route);
function route(){const al=pg(),h=location.hash.slice(1);page=al.includes(h)?h:al[0];if(h!==page)history.replaceState(null,'','#'+page);render();beat()}
// ---------- session ----------
async function signOut(){try{if(auth)await api('presence/'+DEV,'DELETE')}catch(e){}try{localStorage.removeItem('ec_auth')}catch(e){}location.reload()}
window.addEventListener('pagehide',()=>{if(auth&&profile)try{fetch(`${DB}/presence/${DEV}.json?auth=${auth.id}`,{method:'DELETE',keepalive:true})}catch(e){}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)beat()});
async function afterAuth(){let me=await api('users/'+auth.uid);
if(!me&&auth.email==BOOT){try{me={email:auth.email,name:'Admin',role:'admin',perm:mk(PRESETS.admin),off:false,created:{'.sv':'timestamp'}};await api('users/'+auth.uid,'PUT',me)}catch(e){me=null}}
if(!me||me.off){try{localStorage.removeItem('ec_auth')}catch(e){}auth=null;throw Error(me?'This account is disabled':'No access yet. Ask an admin to add your account')}
profile=me;perm=me.perm||{};if(!pg().length){auth=null;throw Error('This account has no pages assigned')}}
function enter(){$('#login').hidden=true;$('#app').hidden=false;$('#app').classList.toggle('solo',pg().length<2);connect();route();
setInterval(beat,25000);setInterval(paintDevices,15000);setInterval(async()=>{try{await refresh();Object.keys(MAPS).filter(n=>want[n]()).forEach(open)}catch(e){}},45*60000);
if(perm.upload){setTimeout(autoSnap,90000);setInterval(autoSnap,600000)}}
$('#lf').addEventListener('submit',async e=>{e.preventDefault();const er=$('#err'),bt=$('#lb');er.textContent='';
if(/^PASTE/.test(FB_KEY)){er.textContent='Add your Firebase Web API key at the top of the file';return}
bt.disabled=true;try{const j=await post(IT+'signInWithPassword?key='+FB_KEY,{email:$('#em').value.trim().toLowerCase(),password:$('#pw').value,returnSecureToken:true});setAuth(j.idToken,j.refreshToken,j.localId,+j.expiresIn);$('#pw').value='';await afterAuth();enter()}catch(x){er.textContent=AE[x.message]||x.message}bt.disabled=false});
(async()=>{let s;try{s=JSON.parse(localStorage.getItem('ec_auth'))}catch(e){}if(!s||!s.ref||/^PASTE/.test(FB_KEY))return;$('#err').textContent='Restoring session…';try{auth={ref:s.ref,exp:0};await refresh();await afterAuth();enter()}catch(e){auth=null;$('#err').textContent=AE[e.message]||e.message}})();
